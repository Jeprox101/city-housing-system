    activity: '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>',
    building: '<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01"/>',
    close: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>'
  };

  function icon(name, size) {
    var s = size || 18;
    return '<svg class="icon" width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || "") + "</svg>";
  }

  /* ---------- Current user & permissions ---------- */

  function getCurrentUser() {
    var users = DB.getUsers();
    var chosen = DB.getUser(DB.getCurrentUserId());
    if (chosen && chosen.status === "Active") return chosen;
    var fallback = users.filter(function (u) { return u.status === "Active" && u.role === "Administrator"; })[0] ||
                   users.filter(function (u) { return u.status === "Active"; })[0] || null;
    if (fallback) DB.setCurrentUserId(fallback.id);
    return fallback;
  }

  function currentUserName() {
    var u = getCurrentUser();
    return u ? u.fullName : "System";
  }

  /** can("editApplicant") -> true / false based on the signed-in role. */
  function can(action) {
    var user = getCurrentUser();
    if (!user) return false;
    var perms = APP_CONFIG.permissions[user.role] || {};
    return !!perms[action];
  }

  function getVisibleApplicants() {
    var user = getCurrentUser();
    var applicants = DB.getApplicants();
    if (!user || user.role !== "Viewer") return applicants;
    return user.applicantId
      ? applicants.filter(function (applicant) { return applicant.id === user.applicantId; })
      : [];
  }

  function canViewApplicant(id) {
    var user = getCurrentUser();
    return !!user && (user.role !== "Viewer" || user.applicantId === id);
  }

  /* ---------- Toast notifications ---------- */

  function toast(message, type) {
    var root = document.getElementById("toast-root");
    var el = document.createElement("div");
    el.className = "toast toast-" + (type || "success");
    el.setAttribute("role", "status");
    el.innerHTML = '<span class="toast-icon">' + icon(type === "error" ? "x" : type === "info" ? "activity" : "check", 18) +
      "</span><span>" + Utils.esc(message) + "</span>";
    root.appendChild(el);
    setTimeout(function () {
      el.classList.add("toast-hide");
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 250);
    }, 3500);
  }

  /* ---------- Modal ---------- */

  var activeModal = null;

  /**
   * Open a modal dialog.
   * options: { title, body (HTML), footer (HTML), size: "sm" | "md" | "lg" }
   * Returns the modal element so callers can attach events.
   */
  function openModal(options) {
    closeModal();
    var root = document.getElementById("modal-root");
    var overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML =
      '<div class="modal modal-' + (options.size || "md") + '" role="dialog" aria-modal="true" aria-label="' + Utils.esc(options.title) + '">' +
        '<div class="modal-header"><h3>' + Utils.esc(options.title) + '</h3>' +
        '<button type="button" class="icon-btn" data-close-modal aria-label="Close">' + icon("close", 18) + "</button></div>" +
        '<div class="modal-body">' + (options.body || "") + "</div>" +
        (options.footer ? '<div class="modal-footer">' + options.footer + "</div>" : "") +
      "</div>";
    overlay.addEventListener("mousedown", function (e) { if (e.target === overlay) closeModal(); });
    overlay.addEventListener("click", function (e) {
      if (e.target.closest("[data-close-modal]")) closeModal();
    });
    root.appendChild(overlay);
    document.body.classList.add("modal-open");
    activeModal = overlay;
    var firstField = overlay.querySelector("input:not([readonly]):not([type=hidden]), select, textarea");
    if (firstField) firstField.focus();
    return overlay;
  }

  function closeModal() {
    if (activeModal && activeModal.parentNode) activeModal.parentNode.removeChild(activeModal);
    activeModal = null;
    document.body.classList.remove("modal-open");
  }

  /* ---------- Confirmation dialog ---------- */

  /**
   * Ask the user to confirm an action. Returns a Promise<boolean>.
   * options: { title, message, confirmText, danger }
   */
  function confirmDialog(options) {
    return new Promise(function (resolve) {
      var root = document.getElementById("confirm-root");
      var overlay = document.createElement("div");
      overlay.className = "modal-overlay modal-overlay-top";
      overlay.innerHTML =
        '<div class="modal modal-sm" role="alertdialog" aria-modal="true">' +
          '<div class="modal-header"><h3>' + Utils.esc(options.title || "Please confirm") + "</h3></div>" +
          '<div class="modal-body"><p class="confirm-message">' + options.message + "</p></div>" +
          '<div class="modal-footer">' +
            '<button type="button" class="btn btn-secondary" data-answer="no">Cancel</button>' +
            '<button type="button" class="btn ' + (options.danger ? "btn-danger" : "btn-primary") + '" data-answer="yes">' +
              Utils.esc(options.confirmText || "Confirm") + "</button>" +
          "</div>" +
        "</div>";
      function finish(answer) {
        document.removeEventListener("keydown", onKey, true);
        if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
        resolve(answer);
      }
      function onKey(e) {
        if (e.key === "Escape") { e.stopPropagation(); finish(false); }
      }
      overlay.addEventListener("click", function (e) {
        var btn = e.target.closest("[data-answer]");
        if (btn) finish(btn.getAttribute("data-answer") === "yes");
      });
      document.addEventListener("keydown", onKey, true);
      root.appendChild(overlay);
      overlay.querySelector('[data-answer="yes"]').focus();
    });
  }

  /* ---------- Page refresh ---------- */

  /** Re-draw the sidebar counters, user switcher and the open page. */
  function refreshAll() {
    renderUserSwitcher();
    Navigation.updateCounts();
    Navigation.refresh();
  }

  function renderUserSwitcher() {
    var select = document.getElementById("current-user-select");
    var current = getCurrentUser();
    var active = DB.getUsers().filter(function (u) { return u.status === "Active"; });
    select.innerHTML = active.map(function (u) {
      return '<option value="' + Utils.esc(u.id) + '"' + (current && u.id === current.id ? " selected" : "") + ">" +
        Utils.esc(u.fullName) + " (" + Utils.esc(u.role) + ")</option>";
    }).join("");
    var roleBadge = document.getElementById("current-user-role");
    roleBadge.textContent = current ? current.role : "";
    document.getElementById("current-user-avatar").textContent = current ? Utils.initials(current.fullName) : "?";
    var viewer = current && current.role === "Viewer";
    document.body.classList.toggle("viewer-mode", !!viewer);
    document.getElementById("page-title").hidden = !!viewer;
    document.getElementById("viewer-brand").hidden = !viewer;
    document.querySelectorAll(".nav-item[data-section]").forEach(function (item) {
      var section = item.getAttribute("data-section");
      item.hidden = viewer && section !== "records";
    });
    document.querySelectorAll(".nav-heading").forEach(function (heading) {
      heading.hidden = viewer;
    });
    var recordsLabel = document.querySelector('.nav-item[data-section="records"] .nav-label');
    if (recordsLabel) recordsLabel.textContent = viewer ? "My Profile" : "Applicants / Records";
  }

  function injectStaticIcons() {
    document.querySelectorAll("[data-icon]").forEach(function (el) {
      el.innerHTML = icon(el.getAttribute("data-icon"), Number(el.getAttribute("data-icon-size")) || 18);
    });
  }

  /** Start the application once the page has loaded. */
  function start() {
    DB.init();
    injectStaticIcons();
    renderUserSwitcher();

    document.getElementById("current-user-select").addEventListener("change", function (e) {
      DB.setCurrentUserId(e.target.value);
      var u = DB.getUser(e.target.value);
      toast("Signed in as " + (u ? u.fullName + " (" + u.role + ")" : "user") + ".", "info");
      refreshAll();
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeModal();
    });

    Navigation.init();
  }

  return {
    icon: icon, can: can, getCurrentUser: getCurrentUser, currentUserName: currentUserName,
    getVisibleApplicants: getVisibleApplicants, canViewApplicant: canViewApplicant,
    toast: toast, openModal: openModal, closeModal: closeModal, confirm: confirmDialog,
    refreshAll: refreshAll, start: start
  };
})();

</script>
  <script>
/* ===== assets\js\filtering.js ===== */
/* ==========================================================
   filtering.js  -  Search, filters and sorting
   Used by every records table (Applicants, Approved,
   For Review, For Survey, Rejected / Denied).
   Each table keeps its own "state" object with the current
   search text, filters and sort order.
   ========================================================== */
var Filtering = (function () {
  "use strict";

  var SORT_CHOICES = [
    { value: "applicationDate:desc", label: "Application date (newest first)" },
    { value: "applicationDate:asc",  label: "Application date (oldest first)" },
    { value: "lastName:asc",         label: "Last name (A to Z)" },
    { value: "lastName:desc",        label: "Last name (Z to A)" },
    { value: "id:asc",               label: "Application ID (lowest first)" },
    { value: "id:desc",              label: "Application ID (highest first)" }
  ];

  function createState() {
    return { search: "", status: "", program: "", barangay: "", dateFrom: "", dateTo: "",
             sortKey: "applicationDate", sortDir: "desc" };
  }

  function norm(value) { return String(value || "").toLowerCase(); }

  /** Search by Application ID, first / middle / last name or barangay. */
  function matchesSearch(a, term) {
    if (!term) return true;
    var haystack = [
      a.id, a.firstName, a.middleName, a.lastName, a.barangay,
      [a.firstName, a.middleName, a.lastName].filter(Boolean).join(" "),
      [a.firstName, a.lastName].filter(Boolean).join(" ")
    ].map(norm).join("|");
    return term.split(/\s+/).every(function (word) { return haystack.indexOf(word) !== -1; });
  }

  function sortRecords(list, key, dir) {
    var factor = dir === "desc" ? -1 : 1;
    return list.slice().sort(function (a, b) {
      var result = norm(a[key]).localeCompare(norm(b[key]), undefined, { numeric: true });
      if (result === 0) result = a.id.localeCompare(b.id);
      return result * factor;
    });
  }

  /** Apply search + filters + sorting from "state" to a list of records. */
  function apply(records, state) {
    var term = norm(state.search).trim();
    var filtered = records.filter(function (a) {
      if (!matchesSearch(a, term)) return false;
      if (state.status && a.status !== state.status) return false;
      if (state.program && a.housingProgram !== state.program) return false;
      if (state.barangay && a.barangay !== state.barangay) return false;
      if (state.dateFrom && a.applicationDate < state.dateFrom) return false;
      if (state.dateTo && a.applicationDate > state.dateTo) return false;
      return true;
    });
    return sortRecords(filtered, state.sortKey, state.sortDir);
  }

  function hasActiveFilters(state) {
    return !!(state.search || state.status || state.program || state.barangay || state.dateFrom || state.dateTo);
  }

  /** HTML of the search / filter bar. */
  function toolbarHTML(showStatus) {
    return '' +
      '<div class="search-box">' + App.icon("search", 16) +
        '<input type="search" data-filter="search" placeholder="Search by ID, name or barangay" aria-label="Search records"></div>' +
      '<div class="filter-row">' +
        (showStatus ? '<label class="filter-field"><span>Status</span><select data-filter="status"></select></label>' : "") +
        '<label class="filter-field"><span>Housing program</span><select data-filter="program"></select></label>' +
        '<label class="filter-field"><span>Barangay</span><select data-filter="barangay"></select></label>' +
        '<label class="filter-field"><span>Date from</span><input type="date" data-filter="dateFrom"></label>' +
        '<label class="filter-field"><span>Date to</span><input type="date" data-filter="dateTo"></label>' +
        '<label class="filter-field"><span>Sort by</span><select data-filter="sort"></select></label>' +
        '<button type="button" class="btn btn-secondary btn-reset" data-filter-reset>' + App.icon("refresh", 16) + " Reset filters</button>" +
      "</div>";
  }

  function fillSelect(select, firstLabel, values, selected) {
    if (!select) return selected;
    var keep = values.indexOf(selected) !== -1 ? selected : "";
    select.innerHTML = Utils.optionsHTML(values, keep, firstLabel);
    return keep;
  }

  /**
   * Refresh dropdown choices from the real records and show the
   * current state in each control.
   */
  function syncControls(root, state, records, statusOptions) {
    var programs = APP_CONFIG.housingPrograms.slice();
    var barangays = [];
    records.forEach(function (a) {
      if (a.housingProgram && programs.indexOf(a.housingProgram) === -1) programs.push(a.housingProgram);
      if (a.barangay && barangays.indexOf(a.barangay) === -1) barangays.push(a.barangay);
    });
    barangays.sort(function (x, y) { return x.localeCompare(y); });

    state.status = fillSelect(root.querySelector('[data-filter="status"]'), "All statuses", statusOptions || [], state.status);
    state.program = fillSelect(root.querySelector('[data-filter="program"]'), "All programs", programs, state.program);
    state.barangay = fillSelect(root.querySelector('[data-filter="barangay"]'), "All barangays", barangays, state.barangay);

    var search = root.querySelector('[data-filter="search"]');
    if (search && search.value !== state.search) search.value = state.search;
    root.querySelector('[data-filter="dateFrom"]').value = state.dateFrom;
    root.querySelector('[data-filter="dateTo"]').value = state.dateTo;

    var sortSelect = root.querySelector('[data-filter="sort"]');
    var current = state.sortKey + ":" + state.sortDir;
    var known = SORT_CHOICES.some(function (c) { return c.value === current; });
    sortSelect.innerHTML = (known ? "" : '<option value="" selected>Sorted by column</option>') +
      SORT_CHOICES.map(function (c) {
        return '<option value="' + c.value + '"' + (c.value === current ? " selected" : "") + ">" + c.label + "</option>";
      }).join("");
  }

  /** Connect the toolbar controls to the state. onChange() redraws the table. */
  function bind(root, state, onChange) {
    var typing = Utils.debounce(function () { onChange(); }, 200);

    root.addEventListener("input", function (e) {
      var key = e.target.getAttribute("data-filter");
      if (key === "search") { state.search = e.target.value; typing(); }
    });

    root.addEventListener("change", function (e) {
      var key = e.target.getAttribute("data-filter");
      if (!key || key === "search") return;
      if (key === "sort") {
        if (e.target.value) {
          var parts = e.target.value.split(":");
          state.sortKey = parts[0];
          state.sortDir = parts[1];
        }
      } else {
        state[key] = e.target.value;
      }
      onChange();
    });

    root.addEventListener("click", function (e) {
      if (e.target.closest("[data-filter-reset]")) {
        var fresh = createState();
        Object.keys(fresh).forEach(function (k) { state[k] = fresh[k]; });
        root.querySelector('[data-filter="search"]').value = "";
        onChange();
        App.toast("Filters have been reset.", "info");
      }
    });
  }

  /** Called when a table header is clicked. */
  function toggleSort(state, key) {
    if (state.sortKey === key) {
      state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
    } else {
      state.sortKey = key;
      state.sortDir = key === "applicationDate" ? "desc" : "asc";
    }
  }

  return {
    createState: createState, apply: apply, hasActiveFilters: hasActiveFilters,
    toolbarHTML: toolbarHTML, syncControls: syncControls, bind: bind, toggleSort: toggleSort
  };
})();

</script>
  <script>
/* ===== assets\js\applicants.js ===== */
/* ==========================================================
   applicants.js  -  Records tables and applicant profile
   One generic table builder serves five pages:
     records   -> every applicant
     approved  -> status = Approved
     review    -> status = For Review
     survey    -> status = For Survey
     rejected  -> status = Rejected or Denied
   Records are read from LocalStorage on every draw, so a status
   change moves the record to the right page automatically.
   ========================================================== */
var Applicants = (function () {
  "use strict";

  var VIEWS = {
    records:  { rootId: "records-root",  title: "Applicants / Records", description: "All registered housing applicants.",
                statuses: null, statusFilter: ["Approved", "For Review", "For Survey", "Rejected", "Denied"],
                emptyText: "No applicants have been registered yet." },
    approved: { rootId: "approved-root", title: "Approved", description: "Applicants whose applications have been approved.",
                statuses: ["Approved"], statusFilter: null, emptyText: "No approved applications yet." },
    review:   { rootId: "review-root",   title: "For Review", description: "Applications waiting for document review.",
                statuses: ["For Review"], statusFilter: null, emptyText: "No applications are waiting for review." },
    survey:   { rootId: "survey-root",   title: "For Survey", description: "Applications that need a site survey or verification.",
                statuses: ["For Survey"], statusFilter: null, emptyText: "No applications are waiting for a survey." },
    rejected: { rootId: "rejected-root", title: "Rejected / Denied", description: "Applications that were rejected or denied.",
                statuses: ["Rejected", "Denied"], statusFilter: ["Rejected", "Denied"], emptyText: "No rejected or denied applications." }
  };

  var COLUMNS = [
    { key: "id", label: "Application ID" },
    { key: "firstName", label: "First Name" },
    { key: "middleName", label: "Middle Name" },
    { key: "lastName", label: "Last Name" },
    { key: "suffix", label: "Suffix" },
    { key: "barangay", label: "Barangay" },
    { key: "applicationDate", label: "Application Date" },
    { key: "status", label: "Status" }
  ];

  var mounted = {};  // key -> { root, state }

  /** Records that belong to this page (before search / filters). */
  function scopedRecords(view) {
    var all = App.getVisibleApplicants();
    if (!view.statuses) return all;
    return all.filter(function (a) { return view.statuses.indexOf(a.status) !== -1; });
  }

  /** Build the page layout once, then keep it. */
  function mount(key) {
    var view = VIEWS[key];
    var root = document.getElementById(view.rootId);
    var state = Filtering.createState();

    root.innerHTML =
      '<div class="page-header">' +
        '<div><h2>' + Utils.esc(view.title) + "</h2><p>" + Utils.esc(view.description) + "</p></div>" +
        '<div class="page-actions" data-slot="actions"></div>' +
      "</div>" +
      '<div class="card toolbar">' + Filtering.toolbarHTML(!!view.statusFilter) + "</div>" +
      '<div class="card table-card">' +
        '<div class="table-meta"><span data-slot="count"></span></div>' +
        '<div class="table-wrap"><table class="data-table">' +
          "<thead><tr>" +
            COLUMNS.map(function (c) {
              return '<th class="sortable" data-sort="' + c.key + '" tabindex="0" scope="col">' + c.label + "</th>";
            }).join("") +
            '<th scope="col" class="col-actions">Actions</th>' +
          "</tr></thead>" +
          '<tbody data-slot="rows"></tbody>' +
        "</table></div>" +
      "</div>";

    Filtering.bind(root, state, function () { draw(key); });

    // Sorting by clicking (or pressing Enter on) a column heading
    function sortFromHeader(e) {
      var th = e.target.closest("th[data-sort]");
      if (!th) return;
      if (e.type === "keydown" && e.key !== "Enter" && e.key !== " ") return;
      e.preventDefault();
      Filtering.toggleSort(state, th.getAttribute("data-sort"));
      draw(key);
    }
    root.querySelector("thead").addEventListener("click", sortFromHeader);
    root.querySelector("thead").addEventListener("keydown", sortFromHeader);

    // Row buttons: View / Edit / Delete
    root.querySelector('[data-slot="rows"]').addEventListener("click", function (e) {
      var btn = e.target.closest("[data-action]");
      if (!btn) return;
      var id = btn.getAttribute("data-id");
      var action = btn.getAttribute("data-action");
      if (action === "view") viewApplicant(id);
      else if (action === "edit") Editing.openApplicantEditor(id);
      else if (action === "delete") deleteApplicant(id);
    });

    mounted[key] = { root: root, state: state };
  }

  /** Redraw the table of one page from the stored records. */
  function draw(key) {
    var view = VIEWS[key];
    var m = mounted[key];
    var root = m.root, state = m.state;
    var user = App.getCurrentUser();
    var viewer = !!(user && user.role === "Viewer");
    root.querySelector(".page-header h2").textContent = viewer ? "My Application" : view.title;
    root.querySelector(".page-header p").textContent = viewer ? "Your housing application." : view.description;

    var scoped = scopedRecords(view);
    Filtering.syncControls(root, state, scoped, view.statusFilter);
    var rows = Filtering.apply(scoped, state);

    // Header actions depend on the signed-in role
    root.querySelector('[data-slot="actions"]').innerHTML = App.can("addApplicant")
      ? '<button type="button" class="btn btn-primary" data-goto="dataform">' + App.icon("plus", 16) + " Add applicant</button>"
      : '<span class="readonly-note">Read-only access</span>';

    // Sort indicators
    root.querySelectorAll("th[data-sort]").forEach(function (th) {
      var active = th.getAttribute("data-sort") === state.sortKey;
      th.classList.toggle("sorted-asc", active && state.sortDir === "asc");
      th.classList.toggle("sorted-desc", active && state.sortDir === "desc");
      th.setAttribute("aria-sort", active ? (state.sortDir === "asc" ? "ascending" : "descending") : "none");
    });

    root.querySelector('[data-slot="count"]').textContent =
      "Showing " + rows.length + " of " + scoped.length + (scoped.length === 1 ? " record" : " records");

    var canEdit = App.can("editApplicant"), canDelete = App.can("deleteApplicant");
    var body = root.querySelector('[data-slot="rows"]');

    if (!rows.length) {
      var message = scoped.length ? "No records match your search or filters." : view.emptyText;
      body.innerHTML = '<tr class="empty-row"><td colspan="' + (COLUMNS.length + 1) + '">' +
        '<div class="empty-state"><strong>' + Utils.esc(message) + "</strong>" +
        (scoped.length && Filtering.hasActiveFilters(state) ? "<span>Try different words or use Reset filters.</span>" : "") +
        "</div></td></tr>";
      return;
    }

    body.innerHTML = rows.map(function (a) {
      var id = Utils.esc(a.id);
      return "<tr>" +
        '<td class="cell-id">' + id + "</td>" +
        "<td>" + Utils.esc(a.firstName) + "</td>" +
        "<td>" + (Utils.esc(a.middleName) || '<span class="muted">-</span>') + "</td>" +
        "<td>" + Utils.esc(a.lastName) + "</td>" +
        "<td>" + (Utils.esc(a.suffix) || '<span class="muted">-</span>') + "</td>" +
        "<td>" + Utils.esc(a.barangay) + "</td>" +
        "<td>" + Utils.formatDate(a.applicationDate) + "</td>" +
        "<td>" + Utils.statusBadge(a.status) + "</td>" +
        '<td class="col-actions"><div class="row-actions">' +
          '<button type="button" class="icon-btn" data-action="view" data-id="' + id + '" title="View profile" aria-label="View ' + id + '">' + App.icon("eye", 17) + "</button>" +
          (canEdit ? '<button type="button" class="icon-btn" data-action="edit" data-id="' + id + '" title="Edit" aria-label="Edit ' + id + '">' + App.icon("edit", 17) + "</button>" : "") +
          (canDelete ? '<button type="button" class="icon-btn icon-btn-danger" data-action="delete" data-id="' + id + '" title="Delete" aria-label="Delete ' + id + '">' + App.icon("trash", 17) + "</button>" : "") +
        "</div></td></tr>";
    }).join("");
  }

  /** Public: show one page (called by navigation). */
  function render(key) {
    var user = App.getCurrentUser();
    if (user && user.role === "Viewer") {
      mounted[key] = null;
      var root = document.getElementById(VIEWS[key].rootId);
      var applicant = App.getVisibleApplicants()[0];
      root.innerHTML = applicant
        ? '<div class="page-header"><div><h2>My Applicant Profile</h2><p>Your application details.</p></div></div>' +
          '<section class="card"><div class="card-body">' + profileHTML(applicant) + "</div></section>"
        : '<div class="page-header"><div><h2>My Applicant Profile</h2></div></div>' +
          '<section class="card"><div class="card-body"><div class="empty-state"><strong>No application is linked to this Viewer account.</strong></div></div></section>';
      return;
    }
    if (!mounted[key]) mount(key);
    draw(key);
  }

  /* ---------- Profile (View) ---------- */

  function field(label, value) {
    return '<div class="detail"><dt>' + label + "</dt><dd>" + (Utils.esc(value) || '<span class="muted">-</span>') + "</dd></div>";
  }

  function profileHTML(a) {
    var age = Utils.computeAge(a.birthdate);
    return '' +
      '<div class="profile-head">' +
        '<div class="avatar avatar-lg">' + Utils.esc(Utils.initials(a.firstName + " " + a.lastName)) + "</div>" +
        '<div><h4>' + Utils.esc(Utils.fullName(a)) + "</h4>" +
        '<p class="muted">Application ID: <strong>' + Utils.esc(a.id) + "</strong></p></div>" +
        '<div class="profile-status">' + Utils.statusBadge(a.status) + "</div>" +
      "</div>" +
      '<h5 class="detail-title">Personal information</h5><dl class="detail-grid">' +
        field("First name", a.firstName) + field("Middle name", a.middleName) +
        field("Last name", a.lastName) + field("Suffix", a.suffix) +
        field("Birthdate", Utils.formatDate(a.birthdate)) + field("Age", age !== "" ? age : a.age) +
        field("Sex", a.sex) + field("Civil status", a.civilStatus) +
        field("Contact number", a.contactNumber) + field("Email address", a.email) +
      "</dl>" +
      '<h5 class="detail-title">Address</h5><dl class="detail-grid">' +
        field("Province", a.province) +
        field("City / Municipality", a.city) + field("Barangay", a.barangay) +
        field("Street / Purok", a.street) +
      "</dl>" +
      '<h5 class="detail-title">Application</h5><dl class="detail-grid">' +
        field("Application date", Utils.formatDate(a.applicationDate)) + field("Housing program", a.housingProgram) +
        field("Status", a.status) + field("Assigned staff", a.assignedStaff) +
        '<div class="detail detail-wide"><dt>Remarks</dt><dd>' + (Utils.esc(a.remarks) || '<span class="muted">-</span>') + "</dd></div>" +
      "</dl>";
  }

  function viewApplicant(id) {
    if (!App.canViewApplicant(id)) { App.toast("You can only view your own application.", "error"); return; }
    var a = DB.getApplicant(id);
    if (!a) { App.toast("That record could not be found.", "error"); return; }
    var footer = '<button type="button" class="btn btn-secondary" data-close-modal>Close</button>' +
      (App.can("editApplicant") ? '<button type="button" class="btn btn-primary" data-edit-from-view>' + App.icon("edit", 16) + " Edit</button>" : "");
    var modal = App.openModal({ title: "Applicant profile", body: profileHTML(a), footer: footer, size: "lg" });
    var editBtn = modal.querySelector("[data-edit-from-view]");
    if (editBtn) editBtn.addEventListener("click", function () { Editing.openApplicantEditor(id); });
  }

  /* ---------- Delete ---------- */

  function deleteApplicant(id) {
    if (!App.can("deleteApplicant")) { App.toast("Only administrators can delete records.", "error"); return; }
    var a = DB.getApplicant(id);
    if (!a) return;
    App.confirm({
      title: "Delete applicant record",
      message: "Delete the record of <strong>" + Utils.esc(Utils.fullName(a)) + "</strong> (" + Utils.esc(a.id) + ")? This cannot be undone.",
      confirmText: "Delete record",
      danger: true
    }).then(function (yes) {
      if (!yes) return;
      if (DB.deleteApplicant(id)) {
        DB.logActivity("delete", "Application " + id + " (" + Utils.fullName(a) + ") was deleted.", App.currentUserName());
        App.toast("Record " + id + " was deleted.");
        App.refreshAll();
      } else {
        App.toast("The record could not be deleted.", "error");
      }
    });
  }

  return { render: render, view: viewApplicant, remove: deleteApplicant, VIEWS: VIEWS };
})();

</script>
  <script>
/* ===== assets\js\dataForm.js ===== */
/* ==========================================================
   dataForm.js  -  Applicant registration form
   buildFields() / validate() / toRecord() are also used by the
   Edit window (editing.js), so the Add and Edit forms always
   have exactly the same fields and rules.
   ========================================================== */
var DataForm = (function () {
  "use strict";

  /* Fields that must be filled in (label used in error messages) */
  var REQUIRED = {
    firstName: "First name", lastName: "Last name", birthdate: "Birthdate", sex: "Sex",
    civilStatus: "Civil status", contactNumber: "Contact number",
    province: "Province", city: "City / Municipality", barangay: "Barangay",
    applicationDate: "Application date", housingProgram: "Housing program",
    status: "Application status", assignedStaff: "Assigned staff"
  };

  var FIELDS = ["id", "firstName", "middleName", "lastName", "suffix", "birthdate", "sex", "civilStatus",
    "contactNumber", "email", "province", "city", "barangay", "street",
    "applicationDate", "housingProgram", "status", "remarks", "assignedStaff"];

  /* ---------- Building the form ---------- */

  function group(prefix, name, label, control, wide) {
    var star = REQUIRED[name] ? ' <span class="req" aria-hidden="true">*</span>' : "";
    return '<div class="form-group' + (wide ? " form-group-wide" : "") + '" data-field="' + name + '">' +
      '<label for="' + prefix + "-" + name + '">' + label + star + "</label>" + control +
      '<span class="field-error" role="alert"></span></div>';
  }

  function input(prefix, name, type, value, extra) {
    return '<input type="' + type + '" id="' + prefix + "-" + name + '" name="' + name + '" value="' + Utils.esc(value) + '" ' + (extra || "") + ">";
  }

  function select(prefix, name, list, value, placeholder) {
    return '<select id="' + prefix + "-" + name + '" name="' + name + '">' + Utils.optionsHTML(list, value, placeholder) + "</select>";
  }

  function datalist(id, items) {
    return '<datalist id="' + id + '">' + items.map(function (i) { return '<option value="' + Utils.esc(i) + '">'; }).join("") + "</datalist>";
  }

  /** Staff names that can be assigned (active admins / staff). */
  function staffNames(current) {
    var names = DB.getUsers().filter(function (u) { return u.status === "Active" && u.role !== "Viewer"; })
      .map(function (u) { return u.fullName; });
    if (current && names.indexOf(current) === -1) names.push(current);
    return names;
  }

  /**
   * HTML for all applicant fields.
   * prefix : "add" or "edit" (keeps element IDs unique)
   * v      : object with the values to show
   */
  function buildFields(prefix, v) {
    v = v || {};
    var today = DB.todayISO();
    var age = v.birthdate ? Utils.computeAge(v.birthdate) : "";
    var provinces = APP_CONFIG.provinceSuggestions.slice();
    var cities = APP_CONFIG.citySuggestions.slice();
    var barangays = APP_CONFIG.barangaySuggestions.slice();
    DB.getApplicants().forEach(function (a) {
      if (a.province && provinces.indexOf(a.province) === -1) provinces.push(a.province);
      if (a.city && cities.indexOf(a.city) === -1) cities.push(a.city);
      if (a.barangay && barangays.indexOf(a.barangay) === -1) barangays.push(a.barangay);
    });

    var statusList = APP_CONFIG.statuses.map(function (s) { return s.value; });

    return '' +
      '<fieldset class="form-section"><legend>Personal information</legend><div class="form-grid">' +
        group(prefix, "id", "Application ID", input(prefix, "id", "text", v.id, "readonly")) +
        group(prefix, "firstName", "First name", input(prefix, "firstName", "text", v.firstName, 'maxlength="50" autocomplete="off"')) +
        group(prefix, "middleName", "Middle name", input(prefix, "middleName", "text", v.middleName, 'maxlength="50" autocomplete="off"')) +
        group(prefix, "lastName", "Last name", input(prefix, "lastName", "text", v.lastName, 'maxlength="50" autocomplete="off"')) +
        group(prefix, "suffix", "Suffix", select(prefix, "suffix", APP_CONFIG.suffixes, v.suffix, "None")) +
        group(prefix, "birthdate", "Birthdate", input(prefix, "birthdate", "date", v.birthdate, 'max="' + today + '"')) +
        group(prefix, "age", "Age", input(prefix, "age", "text", age, "readonly placeholder=\"Automatic\"")) +
        group(prefix, "sex", "Sex", select(prefix, "sex", APP_CONFIG.sexes, v.sex, "Select sex")) +
        group(prefix, "civilStatus", "Civil status", select(prefix, "civilStatus", APP_CONFIG.civilStatuses, v.civilStatus, "Select civil status")) +
        group(prefix, "contactNumber", "Contact number", input(prefix, "contactNumber", "tel", v.contactNumber, 'maxlength="15" placeholder="09XXXXXXXXX"')) +
        group(prefix, "email", "Email address", input(prefix, "email", "email", v.email, 'maxlength="80" placeholder="name@example.com"')) +
      "</div></fieldset>" +

      '<fieldset class="form-section"><legend>Address information</legend><div class="form-grid">' +
        group(prefix, "province", "Province", input(prefix, "province", "text", APP_CONFIG.formDefaults.province, 'maxlength="60" readonly aria-readonly="true"')) +
        group(prefix, "city", "City / Municipality", input(prefix, "city", "text", APP_CONFIG.formDefaults.city, 'maxlength="60" readonly aria-readonly="true"')) +
        group(prefix, "barangay", "Barangay", input(prefix, "barangay", "text", v.barangay, 'list="' + prefix + '-barangay-list" maxlength="60" autocomplete="off"') + datalist(prefix + "-barangay-list", barangays)) +
        group(prefix, "street", "Street / Purok", input(prefix, "street", "text", v.street, 'maxlength="80" autocomplete="off"'), true) +
      "</div></fieldset>" +

      '<fieldset class="form-section"><legend>Application information</legend><div class="form-grid">' +
        group(prefix, "applicationDate", "Application date", input(prefix, "applicationDate", "date", v.applicationDate, 'max="' + today + '"')) +
        group(prefix, "housingProgram", "Housing program", select(prefix, "housingProgram", APP_CONFIG.housingPrograms.concat(
          v.housingProgram && APP_CONFIG.housingPrograms.indexOf(v.housingProgram) === -1 ? [v.housingProgram] : []), v.housingProgram, "Select program")) +
        group(prefix, "status", "Application status", select(prefix, "status", statusList, v.status, "Select status")) +
        group(prefix, "assignedStaff", "Assigned staff", select(prefix, "assignedStaff", staffNames(v.assignedStaff), v.assignedStaff, "Select staff")) +
        group(prefix, "remarks", "Remarks", '<textarea id="' + prefix + '-remarks" name="remarks" rows="3" maxlength="300">' + Utils.esc(v.remarks) + "</textarea>", true) +
      "</div></fieldset>";
  }

  /* ---------- Reading and checking values ---------- */

  function el(root, prefix, name) { return root.querySelector("#" + prefix + "-" + name); }

  function readValues(root, prefix) {
    var data = {};
    FIELDS.forEach(function (name) {
      var node = el(root, prefix, name);
      data[name] = node ? node.value.trim() : "";
    });
    return data;
  }

  function setError(root, prefix, name, message) {
    var wrapper = root.querySelector('[data-field="' + name + '"]');
    if (!wrapper) return;
    wrapper.classList.toggle("has-error", !!message);
    var holder = wrapper.querySelector(".field-error");
    if (holder) holder.textContent = message || "";
  }

  function clearErrors(root) {
    root.querySelectorAll(".form-group.has-error").forEach(function (g) {
      g.classList.remove("has-error");
      g.querySelector(".field-error").textContent = "";
    });
  }

  /**
   * Validate the form. Returns { valid, data }.
   * Shows a message under every field that has a problem.
   */
  function validate(root, prefix) {
    clearErrors(root);
    var data = readValues(root, prefix);
    var errors = {};
    var today = DB.todayISO();

    Object.keys(REQUIRED).forEach(function (name) {
      if (!data[name]) errors[name] = REQUIRED[name] + " is required.";
    });

    if (data.birthdate && !errors.birthdate) {
      if (data.birthdate > today) errors.birthdate = "Birthdate cannot be in the future.";
      else if (Utils.computeAge(data.birthdate) < 18) errors.birthdate = "Applicant must be at least 18 years old.";
      else if (Utils.computeAge(data.birthdate) > 120) errors.birthdate = "Please check the birthdate.";
    }
    if (data.contactNumber && !errors.contactNumber && !Utils.isValidPhone(data.contactNumber)) {
      errors.contactNumber = "Enter a valid contact number (7 to 15 digits).";
    }
    if (data.email && !Utils.isValidEmail(data.email)) errors.email = "Enter a valid email address.";
    if (data.applicationDate && !errors.applicationDate) {
      if (data.applicationDate > today) errors.applicationDate = "Application date cannot be in the future.";
      else if (data.birthdate && data.applicationDate < data.birthdate) errors.applicationDate = "Application date cannot be before the birthdate.";
    }

    var names = Object.keys(errors);
    names.forEach(function (name) { setError(root, prefix, name, errors[name]); });

    if (names.length) {
      var first = FIELDS.filter(function (n) { return errors[n]; })[0];
      var node = el(root, prefix, first);
      if (node) node.focus();
    }
    return { valid: names.length === 0, data: data };
  }

  /** Turn form values into a stored record. */
  function toRecord(data, existing) {
    var record = {};
    FIELDS.forEach(function (name) { record[name] = data[name]; });
    record.province = APP_CONFIG.formDefaults.province;
    record.city = APP_CONFIG.formDefaults.city;
    if (existing && existing.region) record.region = existing.region;
    record.id = existing && existing.id ? existing.id : data.id;
    record.age = Utils.computeAge(data.birthdate);
    record.createdAt = existing && existing.createdAt ? existing.createdAt : new Date().toISOString();
    return record;
  }

  /** Keep Age in sync and clear error messages while typing. */
  function wire(root, prefix) {
    function onEdit(e) {
      var wrapper = e.target.closest(".form-group");
      if (wrapper && wrapper.classList.contains("has-error")) {
        wrapper.classList.remove("has-error");
        wrapper.querySelector(".field-error").textContent = "";
      }
      if (e.target.id === prefix + "-birthdate") {
        var ageField = el(root, prefix, "age");
        var age = Utils.computeAge(e.target.value);
        ageField.value = age === "" || age < 0 ? "" : age;
      }
    }
    root.addEventListener("input", onEdit);
    root.addEventListener("change", onEdit);
  }

  /* ---------- The Data Form page ---------- */

  var initialSnapshot = "";

  function newRecordDefaults() {
    return {
      id: DB.generateApplicationId(),
      applicationDate: DB.todayISO(),
      status: APP_CONFIG.defaultStatus,
      province: APP_CONFIG.formDefaults.province,
      city: APP_CONFIG.formDefaults.city
    };
  }

  function isDirty(root) {
    return JSON.stringify(readValues(root, "add")) !== initialSnapshot;
  }

  function save(root) {
    var result = validate(root, "add");
    if (!result.valid) { App.toast("Please fix the highlighted fields.", "error"); return; }
    var data = result.data;

    // Possible duplicate: same name and birthdate
    var duplicate = DB.getApplicants().filter(function (a) {
      return a.firstName.toLowerCase() === data.firstName.toLowerCase() &&
             a.lastName.toLowerCase() === data.lastName.toLowerCase() &&
             a.birthdate === data.birthdate;
    })[0];

    var proceed = duplicate
      ? App.confirm({
          title: "Possible duplicate",
          message: "An applicant with the same name and birthdate already exists (<strong>" + Utils.esc(duplicate.id) + "</strong>). Save anyway?",
          confirmText: "Save anyway"
        })
      : Promise.resolve(true);

    proceed.then(function (yes) {
      if (!yes) return;
      // Make sure the ID is still unique (another tab may have saved meanwhile)
      if (DB.applicantIdExists(data.id)) {
        data.id = DB.generateApplicationId();
        el(root, "add", "id").value = data.id;
      }
      var record = toRecord(data, null);
      var saved = DB.saveApplicant(record, true);
      if (!saved.ok) { App.toast(saved.error, "error"); return; }
      DB.logActivity("add", "New applicant registered: " + record.id + " (" + Utils.fullName(record) + ").", App.currentUserName());
      App.toast("Applicant saved successfully. Application ID: " + record.id);
      App.refreshAll();   // redraws a fresh, empty form with a new ID
    });
  }

  function render() {
    var root = document.getElementById("dataform-root");

    if (!App.can("addApplicant")) {
      root.innerHTML =
        '<div class="page-header"><div><h2>Data Form</h2><p>Register a new housing applicant.</p></div></div>' +
        '<div class="card notice"><strong>Read-only access</strong>' +
        "<p>Your current role cannot register applicants. Ask an administrator for Staff access.</p>" +
        '<button type="button" class="btn btn-secondary" data-goto="records">Go to records</button></div>';
      return;
    }

    root.innerHTML =
      '<div class="page-header"><div><h2>Data Form</h2><p>Register a new housing applicant. Fields marked <span class="req">*</span> are required.</p></div></div>' +
      '<form id="applicant-form" class="card form-card" novalidate>' +
        buildFields("add", newRecordDefaults()) +
        '<div class="form-actions">' +
          '<button type="submit" class="btn btn-primary">' + App.icon("check", 16) + " Save applicant</button>" +
          '<button type="button" class="btn btn-secondary" data-form-clear>Clear form</button>' +
          '<button type="button" class="btn btn-ghost" data-form-cancel>Cancel</button>' +
        "</div>" +
      "</form>";

    var form = root.querySelector("#applicant-form");
    wire(form, "add");
    initialSnapshot = JSON.stringify(readValues(form, "add"));

    form.addEventListener("submit", function (e) { e.preventDefault(); save(form); });

    form.querySelector("[data-form-clear]").addEventListener("click", function () {
      render();
      App.toast("The form was cleared.", "info");
    });

    form.querySelector("[data-form-cancel]").addEventListener("click", function () {
      if (!isDirty(form)) { Navigation.go("records"); return; }
      App.confirm({
        title: "Discard this form?",
        message: "You have unsaved information. If you cancel now, it will be lost.",
        confirmText: "Discard and leave", danger: true
      }).then(function (yes) { if (yes) Navigation.go("records"); });
    });
  }

  return { render: render, buildFields: buildFields, validate: validate, toRecord: toRecord, wire: wire };
})();

</script>

/* ===== assets\js\editing.js ===== */
/* ==========================================================
   editing.js  -  Edit applicant window
   Re-uses the same fields and validation as the Data Form.
   Only roles with the "editApplicant" permission can save.
   ========================================================== */
var Editing = (function () {
  "use strict";

  var SECTION_LABELS = { approved: "Approved", review: "For Review", survey: "For Survey", rejected: "Rejected / Denied" };
  var ACTIVITY_TYPES = { "Approved": "approved", "For Survey": "survey", "Rejected": "rejected", "Denied": "rejected", "For Review": "review" };

  function openApplicantEditor(id) {
    if (!App.can("editApplicant")) { App.toast("Your role is not allowed to edit records.", "error"); return; }
    var record = DB.getApplicant(id);
    if (!record) { App.toast("That record could not be found.", "error"); return; }

    var modal = App.openModal({
      title: "Edit applicant: " + id,
      size: "lg",
      body: '<form id="edit-form" novalidate>' + DataForm.buildFields("edit", record) + "</form>",
      footer: '<button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>' +
              '<button type="submit" form="edit-form" class="btn btn-primary">' + App.icon("check", 16) + " Save changes</button>"
    });

    var form = modal.querySelector("#edit-form");
    DataForm.wire(form, "edit");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var result = DataForm.validate(form, "edit");
      if (!result.valid) { App.toast("Please fix the highlighted fields.", "error"); return; }

      var updated = DataForm.toRecord(result.data, record);
      var saved = DB.saveApplicant(updated, false);
      if (!saved.ok) { App.toast(saved.error, "error"); return; }

      var statusChanged = record.status !== updated.status;
      var who = App.currentUserName();
      if (statusChanged) {
        DB.logActivity(ACTIVITY_TYPES[updated.status] || "edit",
          "Application " + id + " status changed from " + record.status + " to " + updated.status + ".", who);
      } else {
        DB.logActivity("edit", "Application " + id + " (" + Utils.fullName(updated) + ") was updated.", who);
      }

      App.closeModal();
      App.toast(statusChanged
        ? "Saved. " + id + " now appears under " + SECTION_LABELS[Utils.statusInfo(updated.status).section] + "."
        : "Changes to " + id + " were saved.");
      App.refreshAll();
    });
  }

  return { openApplicantEditor: openApplicantEditor };
})();

</script>
  <script>
/* ===== assets\js\dashboard.js ===== */
/* ==========================================================
   dashboard.js  -  Dashboard page
   Every number is counted from the stored applicant records
   each time the page is drawn, so nothing is typed in by hand.
   ========================================================== */
var Dashboard = (function () {
  "use strict";

  var ACTIVITY_ICONS = {
    approved: "check", survey: "map", rejected: "x", review: "clock",
    add: "plus", edit: "edit", delete: "trash", user: "users"
  };

  function countBy(list, status) {
    return list.filter(function (a) { return a.status === status; }).length;
  }

  function statCard(goto, icon, tone, label, value) {
    return '<button type="button" class="stat-card stat-' + tone + '" data-goto="' + goto + '">' +
      '<span class="stat-icon">' + App.icon(icon, 22) + "</span>" +
      '<span class="stat-text"><span class="stat-value">' + value + '</span><span class="stat-label">' + label + "</span></span></button>";
  }

  function recentRows(list) {
    var recent = list.slice().sort(function (a, b) {
      if (a.applicationDate !== b.applicationDate) return a.applicationDate < b.applicationDate ? 1 : -1;
      return a.id < b.id ? 1 : -1;
    }).slice(0, 6);
    if (!recent.length) return '<tr class="empty-row"><td colspan="5"><div class="empty-state"><strong>No applications yet.</strong></div></td></tr>';
    return recent.map(function (a) {
      return "<tr>" +
        '<td class="cell-id">' + Utils.esc(a.id) + "</td>" +
        "<td>" + Utils.esc(Utils.fullName(a)) + "</td>" +
        "<td>" + Utils.formatDate(a.applicationDate) + "</td>" +
        "<td>" + Utils.statusBadge(a.status) + "</td>" +
        '<td class="col-actions"><button type="button" class="icon-btn" data-view="' + Utils.esc(a.id) + '" title="View profile" aria-label="View ' + Utils.esc(a.id) + '">' + App.icon("eye", 17) + "</button></td>" +
      "</tr>";
    }).join("");
  }

  function overviewBars(list) {
    var total = list.length;
    return APP_CONFIG.statuses.map(function (s) {
      var count = countBy(list, s.value);
      var pct = total ? Math.round((count / total) * 100) : 0;
      return '<div class="bar-row"><div class="bar-label"><span>' + Utils.esc(s.value) + "</span><span>" + count + " (" + pct + "%)</span></div>" +
        '<div class="bar-track"><div class="bar-fill bar-' + s.css + '" style="width:' + pct + '%"></div></div></div>';
    }).join("");
  }

  function activityItems() {
    var items = DB.getActivities(8);
    if (!items.length) return '<li class="empty-state"><strong>No activity yet.</strong></li>';
    return items.map(function (a) {
      return '<li class="activity-item"><span class="activity-icon activity-' + Utils.esc(a.type) + '">' + App.icon(ACTIVITY_ICONS[a.type] || "activity", 16) + "</span>" +
        '<div><p>' + Utils.esc(a.message) + '</p><small class="muted">' + Utils.esc(a.user) + " - " + Utils.formatDateTime(a.timestamp) + "</small></div></li>";
    }).join("");
  }

  function quickActions() {
    var html = "";
    var user = App.getCurrentUser();
    if (user && user.role === "Viewer") {
      return '<button type="button" class="btn btn-secondary" data-goto="records">' + App.icon("list", 16) + " View my application</button>";
    }
    if (App.can("addApplicant")) html += '<button type="button" class="btn btn-primary" data-goto="dataform">' + App.icon("plus", 16) + " Add applicant</button>";
    html += '<button type="button" class="btn btn-secondary" data-goto="records">' + App.icon("list", 16) + " View all records</button>";
    html += '<button type="button" class="btn btn-secondary" data-goto="review">' + App.icon("clock", 16) + " Open For Review</button>";
    html += '<button type="button" class="btn btn-secondary" data-goto="survey">' + App.icon("map", 16) + " Open For Survey</button>";
    if (App.can("manageUsers")) html += '<button type="button" class="btn btn-secondary" data-quick="add-user">' + App.icon("users", 16) + " Add user</button>";
    return html;
  }

  function render() {
    var user = App.getCurrentUser();
    var viewer = user && user.role === "Viewer";
    var list = App.getVisibleApplicants();
    var rejectedTotal = countBy(list, "Rejected") + countBy(list, "Denied");
    var today = new Date().toLocaleDateString("en-US", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
    var root = document.getElementById("dashboard-root");

    root.innerHTML =
      '<div class="page-header"><div><h2>' + (viewer ? "My Application" : "Dashboard") + '</h2><p>' + (viewer ? "Your housing application." : "Overview of housing applications as of " + today + ".") + "</p></div></div>" +
      '<div class="stat-grid">' +
        statCard("records", "users", "total", "Total Applicants", list.length) +
        statCard("approved", "check", "approved", "Approved Applications", countBy(list, "Approved")) +
        statCard("review", "clock", "review", "For Review", countBy(list, "For Review")) +
        statCard("survey", "map", "survey", "For Survey", countBy(list, "For Survey")) +
        statCard("rejected", "x", "rejected", "Rejected / Denied", rejectedTotal) +
      "</div>" +
      '<div class="dash-grid">' +
        '<section class="card dash-wide"><div class="card-header"><h3>' + (viewer ? "My Application" : "Recent Applications") + "</h3>" +
          '<button type="button" class="btn btn-link" data-goto="records">View all</button></div>' +
          '<div class="table-wrap"><table class="data-table"><thead><tr><th>Application ID</th><th>Applicant</th><th>Date</th><th>Status</th><th class="col-actions">View</th></tr></thead>' +
          "<tbody>" + recentRows(list) + "</tbody></table></div></section>" +
        '<section class="card"><div class="card-header"><h3>Application Status Overview</h3></div><div class="card-body">' + overviewBars(list) + "</div></section>" +
        '<section class="card"><div class="card-header"><h3>Quick Actions</h3></div><div class="card-body quick-actions">' + quickActions() + "</div></section>" +
        (viewer ? "" : '<section class="card dash-wide"><div class="card-header"><h3>Recent Activity</h3></div><ul class="activity-list">' + activityItems() + "</ul></section>") +
      "</div>";

    root.onclick = function (e) {
      var view = e.target.closest("[data-view]");
      if (view) { Applicants.view(view.getAttribute("data-view")); return; }
      if (e.target.closest('[data-quick="add-user"]')) {
        Navigation.go("users");
        Users.openAddUser();
      }
    };
  }

  return { render: render };
})();

  <script>
/* ===== assets\js\users.js ===== */
/* ==========================================================
   users.js  -  System users (staff and administrators)
   These are office staff accounts, NOT housing applicants.
   Only Administrators can add, edit or delete users.
   ========================================================== */
var Users = (function () {
  "use strict";

  var state = { search: "", role: "", status: "" };
  var root = null;

  function roleBadge(role) {
    var css = role === "Administrator" ? "admin" : role === "Staff" ? "staff" : "viewer";
    return '<span class="badge badge-role-' + css + '">' + Utils.esc(role) + "</span>";
  }

  function accountBadge(status) {
    return '<span class="badge badge-' + (status === "Active" ? "active" : "inactive") + '">' + Utils.esc(status) + "</span>";
  }

  function filteredUsers() {
    var term = state.search.trim().toLowerCase();
    return DB.getUsers().filter(function (u) {
      if (state.role && u.role !== state.role) return false;
      if (state.status && u.status !== state.status) return false;
      if (!term) return true;
      return [u.fullName, u.username, u.email, u.position].join("|").toLowerCase().indexOf(term) !== -1;
    }).sort(function (a, b) { return a.fullName.localeCompare(b.fullName); });
  }

  /* ---------- Page ---------- */

  function mount() {
    root = document.getElementById("users-root");
    root.innerHTML =
      '<div class="page-header"><div><h2>Users</h2><p>Office staff and administrators who use this system.</p></div>' +
        '<div class="page-actions" data-slot="actions"></div></div>' +
      '<div class="card toolbar">' +
        '<div class="search-box">' + App.icon("search", 16) + '<input type="search" data-user-filter="search" placeholder="Search by name, username or email" aria-label="Search users"></div>' +
        '<div class="filter-row">' +
          '<label class="filter-field"><span>Role</span><select data-user-filter="role"></select></label>' +
          '<label class="filter-field"><span>Account status</span><select data-user-filter="status"></select></label>' +
          '<button type="button" class="btn btn-secondary btn-reset" data-user-reset>' + App.icon("refresh", 16) + " Reset filters</button>" +
        "</div></div>" +
      '<div class="card table-card"><div class="table-meta"><span data-slot="count"></span></div>' +
        '<div class="table-wrap"><table class="data-table"><thead><tr>' +
          "<th>User</th><th>Username</th><th>Role</th><th>Account status</th><th>Email</th><th class=\"col-actions\">Actions</th>" +
        '</tr></thead><tbody data-slot="rows"></tbody></table></div></div>' +
      '<section class="card role-card"><div class="card-header"><h3>User roles</h3></div><div class="role-grid">' +
        APP_CONFIG.roles.map(function (r) {
          return '<div class="role-item">' + roleBadge(r) + "<p>" + Utils.esc(APP_CONFIG.roleDescriptions[r]) + "</p></div>";
        }).join("") + "</div></section>";

    var typing = Utils.debounce(draw, 200);
    root.addEventListener("input", function (e) {
      if (e.target.getAttribute("data-user-filter") === "search") { state.search = e.target.value; typing(); }
    });
    root.addEventListener("change", function (e) {
      var key = e.target.getAttribute("data-user-filter");
      if (key === "role" || key === "status") { state[key] = e.target.value; draw(); }
    });
    root.addEventListener("click", function (e) {
      if (e.target.closest("[data-user-reset]")) {
        state = { search: "", role: "", status: "" };
        root.querySelector('[data-user-filter="search"]').value = "";
        draw();
        App.toast("Filters have been reset.", "info");
        return;
      }
      if (e.target.closest("[data-add-user]")) { openAddUser(); return; }
      if (e.target.closest("[data-reset-data]")) { resetSampleData(); return; }
      var btn = e.target.closest("[data-user-action]");
      if (!btn) return;
      var id = btn.getAttribute("data-id");
      var action = btn.getAttribute("data-user-action");
      if (action === "view") viewUser(id);
      else if (action === "edit") openUserForm(id);
      else if (action === "delete") deleteUser(id);
    });
  }

  function draw() {
    var all = DB.getUsers();
    var rows = filteredUsers();
    var manage = App.can("manageUsers");

    root.querySelector('[data-slot="actions"]').innerHTML = manage
      ? '<button type="button" class="btn btn-secondary" data-reset-data>' + App.icon("refresh", 16) + " Reset sample data</button>" +
        '<button type="button" class="btn btn-primary" data-add-user>' + App.icon("plus", 16) + " Add user</button>"
      : '<span class="readonly-note">Only administrators can manage users</span>';

    root.querySelector('[data-user-filter="role"]').innerHTML = Utils.optionsHTML(APP_CONFIG.roles, state.role, "All roles");
    root.querySelector('[data-user-filter="status"]').innerHTML = Utils.optionsHTML(APP_CONFIG.userStatuses, state.status, "All statuses");

    root.querySelector('[data-slot="count"]').textContent =
      "Showing " + rows.length + " of " + all.length + (all.length === 1 ? " user" : " users");

    var body = root.querySelector('[data-slot="rows"]');
    if (!rows.length) {
      body.innerHTML = '<tr class="empty-row"><td colspan="6"><div class="empty-state"><strong>' +
        (all.length ? "No users match your search or filters." : "No users have been added yet.") + "</strong></div></td></tr>";
      return;
    }
    body.innerHTML = rows.map(function (u) {
      var id = Utils.esc(u.id);
      return "<tr>" +
        '<td><div class="user-cell"><span class="avatar">' + Utils.esc(Utils.initials(u.fullName)) + "</span><div><strong>" + Utils.esc(u.fullName) +
          '</strong><small class="muted">' + Utils.esc(u.position) + "</small></div></div></td>" +
        "<td>" + Utils.esc(u.username) + "</td>" +
        "<td>" + roleBadge(u.role) + "</td>" +
        "<td>" + accountBadge(u.status) + "</td>" +
        "<td>" + (Utils.esc(u.email) || '<span class="muted">-</span>') + "</td>" +
        '<td class="col-actions"><div class="row-actions">' +
          '<button type="button" class="icon-btn" data-user-action="view" data-id="' + id + '" title="View profile" aria-label="View profile of ' + Utils.esc(u.fullName) + '">' + App.icon("eye", 17) + "</button>" +
          (manage ? '<button type="button" class="icon-btn" data-user-action="edit" data-id="' + id + '" title="Edit" aria-label="Edit ' + Utils.esc(u.fullName) + '">' + App.icon("edit", 17) + "</button>" +
                    '<button type="button" class="icon-btn icon-btn-danger" data-user-action="delete" data-id="' + id + '" title="Delete" aria-label="Delete ' + Utils.esc(u.fullName) + '">' + App.icon("trash", 17) + "</button>" : "") +
        "</div></td></tr>";
    }).join("");
  }

  function render() {
    if (!root) mount();
    draw();
  }

  /* ---------- Profile ---------- */

  function viewUser(id) {
    var u = DB.getUser(id);
    if (!u) return;
    var perms = APP_CONFIG.permissions[u.role] || {};
    var abilities = [
      ["Register applicants", perms.addApplicant], ["Edit applicants", perms.editApplicant],
      ["Delete applicants", perms.deleteApplicant], ["Manage users", perms.manageUsers]
    ].map(function (p) {
      return '<li class="' + (p[1] ? "yes" : "no") + '">' + (p[1] ? "Can" : "Cannot") + " " + p[0].charAt(0).toLowerCase() + p[0].slice(1) + "</li>";
    }).join("");

    var body =
      '<div class="profile-head"><div class="avatar avatar-lg">' + Utils.esc(Utils.initials(u.fullName)) + "</div>" +
        "<div><h4>" + Utils.esc(u.fullName) + '</h4><p class="muted">' + Utils.esc(u.position) + "</p></div>" +
        '<div class="profile-status">' + roleBadge(u.role) + " " + accountBadge(u.status) + "</div></div>" +
      '<dl class="detail-grid">' +
        '<div class="detail"><dt>User ID</dt><dd>' + Utils.esc(u.id) + "</dd></div>" +
        '<div class="detail"><dt>Username</dt><dd>' + Utils.esc(u.username) + "</dd></div>" +
        '<div class="detail"><dt>Email address</dt><dd>' + (Utils.esc(u.email) || "-") + "</dd></div>" +
        '<div class="detail"><dt>Contact number</dt><dd>' + (Utils.esc(u.contactNumber) || "-") + "</dd></div>" +
        '<div class="detail"><dt>Date created</dt><dd>' + Utils.formatDate(u.dateCreated) + "</dd></div>" +
        '<div class="detail"><dt>Account status</dt><dd>' + Utils.esc(u.status) + "</dd></div>" +
      "</dl>" +
      '<h5 class="detail-title">What this role can do</h5><ul class="ability-list">' + abilities + "</ul>";

    var footer = '<button type="button" class="btn btn-secondary" data-close-modal>Close</button>' +
      (App.can("manageUsers") ? '<button type="button" class="btn btn-primary" data-edit-user>' + App.icon("edit", 16) + " Edit user</button>" : "");
    var modal = App.openModal({ title: "User profile", body: body, footer: footer, size: "md" });
    var edit = modal.querySelector("[data-edit-user]");
    if (edit) edit.addEventListener("click", function () { openUserForm(id); });
  }

  /* ---------- Add / Edit ---------- */

  function openAddUser() { openUserForm(null); }

  function userField(name, label, control, required) {
    return '<div class="form-group" data-field="' + name + '"><label for="user-' + name + '">' + label +
      (required ? ' <span class="req" aria-hidden="true">*</span>' : "") + "</label>" + control +
      '<span class="field-error" role="alert"></span></div>';
  }

  function openUserForm(id) {
    if (!App.can("manageUsers")) { App.toast("Only administrators can manage users.", "error"); return; }
    var existing = id ? DB.getUser(id) : null;
    if (id && !existing) return;
    var u = existing || { fullName: "", username: "", email: "", contactNumber: "", position: "", role: "Staff", status: "Active" };

    function text(name, type, value, extra) {
      return '<input type="' + type + '" id="user-' + name + '" name="' + name + '" value="' + Utils.esc(value) + '" ' + (extra || "") + ">";
    }

    var body = '<form id="user-form" novalidate><div class="form-grid">' +
      userField("fullName", "Full name", text("fullName", "text", u.fullName, 'maxlength="80" autocomplete="off"'), true) +
      userField("username", "Username", text("username", "text", u.username, 'maxlength="20" autocomplete="off"'), true) +
      userField("email", "Email address", text("email", "email", u.email, 'maxlength="80"'), true) +
      userField("contactNumber", "Contact number", text("contactNumber", "tel", u.contactNumber, 'maxlength="15"'), false) +
      userField("position", "Position", text("position", "text", u.position, 'maxlength="60"'), false) +
      userField("role", "User role", '<select id="user-role" name="role">' + Utils.optionsHTML(APP_CONFIG.roles, u.role) + "</select>", true) +
      userField("status", "Account status", '<select id="user-status" name="status">' + Utils.optionsHTML(APP_CONFIG.userStatuses, u.status) + "</select>", true) +
      "</div></form>";

    var modal = App.openModal({
      title: existing ? "Edit user" : "Add user", body: body, size: "md",
      footer: '<button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>' +
              '<button type="submit" form="user-form" class="btn btn-primary">' + App.icon("check", 16) + (existing ? " Save changes" : " Add user") + "</button>"
    });

    var form = modal.querySelector("#user-form");
    form.addEventListener("input", function (e) {
      var g = e.target.closest(".form-group");
      if (g) { g.classList.remove("has-error"); g.querySelector(".field-error").textContent = ""; }
    });

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var data = {};
      ["fullName", "username", "email", "contactNumber", "position", "role", "status"].forEach(function (n) {
        data[n] = form.querySelector("#user-" + n).value.trim();
      });

      var errors = {};
      if (!data.fullName) errors.fullName = "Full name is required.";
      if (!data.username) errors.username = "Username is required.";
      else if (!/^[A-Za-z0-9._-]{3,20}$/.test(data.username)) errors.username = "Use 3 to 20 letters, numbers, dots, dashes or underscores.";
      if (!data.email) errors.email = "Email address is required.";
      else if (!Utils.isValidEmail(data.email)) errors.email = "Enter a valid email address.";
      if (data.contactNumber && !Utils.isValidPhone(data.contactNumber)) errors.contactNumber = "Enter a valid contact number.";

      // Keep at least one active administrator
      if (existing && existing.role === "Administrator" && existing.status === "Active" &&
          (data.role !== "Administrator" || data.status !== "Active") && countActiveAdmins(existing.id) === 0) {
        errors.role = "At least one active administrator is required.";
      }

      var names = Object.keys(errors);
      form.querySelectorAll(".form-group").forEach(function (g) {
        var name = g.getAttribute("data-field");
        g.classList.toggle("has-error", !!errors[name]);
        g.querySelector(".field-error").textContent = errors[name] || "";
      });
      if (names.length) {
        form.querySelector("#user-" + names[0]).focus();
        App.toast("Please fix the highlighted fields.", "error");
        return;
      }

      var record = {
        id: existing ? existing.id : DB.generateUserId(),
        fullName: data.fullName, username: data.username, email: data.email,
        contactNumber: data.contactNumber, position: data.position, role: data.role, status: data.status,
        dateCreated: existing ? existing.dateCreated : DB.todayISO(),
        applicantId: existing ? existing.applicantId : undefined
      };
      var saved = DB.saveUser(record, !existing);
      if (!saved.ok) { App.toast(saved.error, "error"); return; }

      DB.logActivity("user", "User account for " + record.fullName + (existing ? " was updated." : " was created."), App.currentUserName());
      App.closeModal();
      App.toast(existing ? "User changes were saved." : "User " + record.fullName + " was added.");
      App.refreshAll();
    });
  }

  function countActiveAdmins(exceptId) {
    return DB.getUsers().filter(function (u) {
      return u.id !== exceptId && u.role === "Administrator" && u.status === "Active";
    }).length;
  }

  /* ---------- Delete / Reset ---------- */

  function deleteUser(id) {
    if (!App.can("manageUsers")) { App.toast("Only administrators can manage users.", "error"); return; }
    var u = DB.getUser(id);
    if (!u) return;
    var me = App.getCurrentUser();
    if (me && me.id === id) { App.toast("You cannot delete the account you are signed in with.", "error"); return; }
    if (u.role === "Administrator" && u.status === "Active" && countActiveAdmins(id) === 0) {
      App.toast("You cannot delete the last active administrator.", "error");
      return;
    }
    var assigned = DB.getApplicants().filter(function (a) { return a.assignedStaff === u.fullName; }).length;
    App.confirm({
      title: "Delete user",
      message: "Delete the account of <strong>" + Utils.esc(u.fullName) + "</strong>?" +
        (assigned ? " Their name stays on " + assigned + " applicant record" + (assigned === 1 ? "" : "s") + " as Assigned Staff." : "") +
        " This cannot be undone.",
      confirmText: "Delete user", danger: true
    }).then(function (yes) {
      if (!yes) return;
      if (DB.deleteUser(id)) {
        DB.logActivity("user", "User account for " + u.fullName + " was deleted.", App.currentUserName());
        App.toast("User " + u.fullName + " was deleted.");
        App.refreshAll();
      } else {
        App.toast("The user could not be deleted.", "error");
      }
    });
  }

  function resetSampleData() {
    if (!App.can("resetData")) return;
    App.confirm({
      title: "Reset sample data",
      message: "This removes every record, user and activity you added or changed, and loads the original sample data again.",
      confirmText: "Reset data", danger: true
    }).then(function (yes) {
      if (!yes) return;
      DB.resetAll();
      App.toast("Sample data was restored.", "info");
      App.refreshAll();
    });
  }

  return { render: render, openAddUser: openAddUser };
})();

</script>
  <script>
/* ===== assets\js\navigation.js ===== */
/* ==========================================================
   navigation.js  -  Sidebar, page switching and URL hash
   Loaded last. It starts the application when the page is
   ready, after every other script has been defined.
   ========================================================== */
var Navigation = (function () {
  "use strict";

  /* id -> page title and the function that draws it */
  var SECTIONS = {
    dashboard: { title: "Dashboard",           render: function () { Dashboard.render(); } },
    users:     { title: "Users",               render: function () { Users.render(); } },
    dataform:  { title: "Data Form",           render: function () { DataForm.render(); } },
    records:   { title: "Applicants / Records", render: function () { Applicants.render("records"); } },
    approved:  { title: "Approved",            render: function () { Applicants.render("approved"); } },
    review:    { title: "For Review",          render: function () { Applicants.render("review"); } },
    survey:    { title: "For Survey",          render: function () { Applicants.render("survey"); } },
    rejected:  { title: "Rejected / Denied",   render: function () { Applicants.render("rejected"); } }
  };

  var current = null;

  function setSidebarOpen(open) {
    document.body.classList.toggle("sidebar-open", open);
    document.getElementById("menu-toggle").setAttribute("aria-expanded", String(open));
    document.getElementById("menu-toggle").setAttribute("aria-label", open ? "Close menu" : "Open menu");
  }

  /** Show one page and draw its content. */
  function go(id) {
    if (!SECTIONS[id]) id = "dashboard";
    var user = App.getCurrentUser();
    if (user && user.role === "Viewer") id = "records";
    current = id;

    document.querySelectorAll(".page").forEach(function (page) {
      page.hidden = page.id !== "section-" + id;
    });
    document.querySelectorAll(".nav-item").forEach(function (item) {
      var active = item.getAttribute("data-section") === id;
      item.classList.toggle("active", active);
      if (active) item.setAttribute("aria-current", "page"); else item.removeAttribute("aria-current");
    });

    var pageTitle = id === "records" && user && user.role === "Viewer" ? "My Profile" : SECTIONS[id].title;
    document.getElementById("page-title").textContent = pageTitle;
    document.title = pageTitle + " | City Housing Development Office";
    if (window.location.hash !== "#" + id) window.location.hash = id;

    updateCounts();
    SECTIONS[id].render();
    setSidebarOpen(false);
    window.scrollTo(0, 0);
    document.getElementById("main-content").scrollTop = 0;
  }

  /** Redraw the page that is currently open. */
  function refresh() {
    if (!current) return;
    var user = App.getCurrentUser();
    if (user && user.role === "Viewer" && current !== "records") {
      go("records");
      return;
    }
    SECTIONS[current].render();
  }

  /** Update the small number badges in the sidebar. */
  function updateCounts() {
    var list = App.getVisibleApplicants();
    var counts = {
      records: list.length,
      approved: list.filter(function (a) { return a.status === "Approved"; }).length,
      review: list.filter(function (a) { return a.status === "For Review"; }).length,
      survey: list.filter(function (a) { return a.status === "For Survey"; }).length,
      rejected: list.filter(function (a) { return a.status === "Rejected" || a.status === "Denied"; }).length
    };
    document.querySelectorAll("[data-count]").forEach(function (el) {
      el.textContent = counts[el.getAttribute("data-count")];
    });
  }

  function init() {
    // Any element with data-section or data-goto switches the page
    document.addEventListener("click", function (e) {
      var target = e.target.closest("[data-section], [data-goto]");
      if (!target) return;
      e.preventDefault();
      App.closeModal();
      go(target.getAttribute("data-section") || target.getAttribute("data-goto"));
    });

    document.getElementById("menu-toggle").addEventListener("click", function () {
      setSidebarOpen(!document.body.classList.contains("sidebar-open"));
    });
    document.getElementById("sidebar-backdrop").addEventListener("click", function () { setSidebarOpen(false); });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") setSidebarOpen(false);
    });

    window.addEventListener("hashchange", function () {
      var id = window.location.hash.replace("#", "");
      if (id !== current) go(id);
    });

    go(window.location.hash.replace("#", "") || "dashboard");
  }

  return { init: init, go: go, refresh: refresh, updateCounts: updateCounts };
})();

/* Start the application after the whole page and all scripts are loaded. */
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", App.start);
} else {
  App.start();
}

</script>
