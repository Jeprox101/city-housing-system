<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>City Housing Development Office</title>


  <style>
/* ===== style.css ===== */

:root {
  --primary: #1d4ed8;
  --primary-dark: #1e40af;
  --primary-soft: #eff4ff;
  --text: #1f2937;
  --muted: #6b7280;
  --border: #e5e7eb;
  --bg: #ffffff;
  --page-bg: #f9fafb;
  --sidebar-bg: #f3f4f6;
  --green: #15803d;  --green-soft: #dcfce7;
  --amber: #b45309;  --amber-soft: #fef3c7;
  --cyan: #0e7490;   --cyan-soft: #cffafe;
  --red: #b91c1c;    --red-soft: #fee2e2;
  --gray-soft: #e5e7eb;
  --radius: 6px;
  --sidebar-width: 272px;
  --topbar-height: 60px;
}

*, *::before, *::after { box-sizing: border-box; }

html { font-size: 16px; }

body {
  margin: 0;
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  color: var(--text);
  background: var(--page-bg);
  line-height: 1.5;
}
body.modal-open { overflow: hidden; }

h1, h2, h3, h4, h5, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }

:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

.icon { flex-shrink: 0; vertical-align: middle; }
.muted { color: var(--muted); }
.req { color: var(--red); }

/* ---------- Layout ---------- */
.app-shell { min-height: 100vh; }

.sidebar {
  position: fixed; inset: 0 auto 0 0;
  width: var(--sidebar-width);
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  z-index: 30;
}
.brand { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--border); height: var(--topbar-height); }
.brand-mark { width: 36px; height: 36px; border-radius: var(--radius); object-fit: contain; flex-shrink: 0; }
.brand-text { display: flex; flex-direction: column; line-height: 1.2; }
.brand-text strong { font-size: 0.95rem; }
.brand-text span { font-size: 0.8rem; color: var(--muted); }

.nav { flex: 1; overflow-y: auto; padding: 12px; }
.nav-heading { margin: 16px 10px 6px; font-size: 0.8rem; font-weight: 600; color: var(--muted); }
.nav-item {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 9px 10px; margin-bottom: 2px;
  border: 0; border-radius: var(--radius);
  background: transparent; color: var(--text); text-align: left;
}
.nav-item:hover { background: #e5e7eb; }
.nav-item.active { background: var(--primary); color: #fff; }
.nav-icon { display: flex; }
.nav-label { flex: 1; font-size: 0.92rem; }
.nav-count {
  min-width: 24px; padding: 1px 7px; border-radius: 999px;
  background: #fff; border: 1px solid var(--border);
  font-size: 0.75rem; text-align: center; color: var(--muted);
}
.nav-item.active .nav-count { background: rgba(255,255,255,0.2); border-color: transparent; color: #fff; }
.sidebar-footer { padding: 14px 18px; border-top: 1px solid var(--border); font-size: 0.75rem; color: var(--muted); }
.sidebar-backdrop { display: none; }

.main { margin-left: var(--sidebar-width); min-height: 100vh; display: flex; flex-direction: column; }
body.viewer-mode .sidebar,
body.viewer-mode .sidebar-backdrop { display: none !important; }
body.viewer-mode .main { margin-left: 0; }
body.viewer-mode .content { display: flex; justify-content: center; max-width: none; }
body.viewer-mode .content > .page { width: 100%; max-width: 900px; }
body.viewer-mode .topbar .menu-toggle { display: none; }

.topbar {
  position: sticky; top: 0; z-index: 20;
  height: var(--topbar-height);
  display: flex; align-items: center; gap: 14px;
  padding: 0 28px;
  background: var(--bg); border-bottom: 1px solid var(--border);
}
.page-title { font-size: 1.15rem; font-weight: 600; flex: 1; }
.topbar .menu-toggle { display: none; }
.topbar-brand { display: none; align-items: center; gap: 12px; flex: 1; min-width: 0; }
.topbar-brand .brand-mark { width: 36px; height: 36px; }
body.viewer-mode .topbar-brand { display: flex; }

.user-switcher { display: flex; align-items: center; gap: 10px; }
.user-switcher-text { display: flex; flex-direction: column; line-height: 1.2; }
.user-switcher-text label { font-size: 0.72rem; color: var(--muted); }
.user-switcher select { border: 0; background: transparent; font-size: 0.9rem; font-weight: 600; padding: 0; max-width: 260px; cursor: pointer; }

.content { flex: 1; padding: 28px; max-width: 1400px; width: 100%; }

.page-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.page-header h2 { font-size: 1.4rem; font-weight: 600; }
.page-header p { color: var(--muted); margin-top: 2px; }
.page-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.readonly-note { font-size: 0.85rem; color: var(--muted); background: var(--sidebar-bg); padding: 6px 12px; border-radius: var(--radius); }

.card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); }
.card-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.card-header h3 { font-size: 1rem; font-weight: 600; }
.card-body { padding: 18px; }
.notice { padding: 24px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 16px; border-radius: var(--radius);
  border: 1px solid transparent; font-weight: 500; font-size: 0.92rem;
  transition: background-color 0.15s, border-color 0.15s;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-secondary { background: #fff; border-color: #d1d5db; color: var(--text); }
.btn-secondary:hover { background: var(--sidebar-bg); }
.btn-danger { background: var(--red); color: #fff; }
.btn-danger:hover { background: #991b1b; }
.btn-ghost { background: transparent; color: var(--muted); }
.btn-ghost:hover { background: var(--sidebar-bg); color: var(--text); }
.btn-link { background: transparent; border: 0; color: var(--primary); padding: 4px 6px; }
.btn-link:hover { text-decoration: underline; }

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: var(--radius);
  border: 1px solid transparent; background: transparent; color: var(--muted);
}
.icon-btn:hover { background: var(--sidebar-bg); color: var(--primary); }
.icon-btn-danger:hover { background: var(--red-soft); color: var(--red); }

/* ---------- Badges ---------- */
.badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; white-space: nowrap; }
.badge-approved { background: var(--green-soft); color: var(--green); }
.badge-review   { background: var(--amber-soft); color: var(--amber); }
.badge-survey   { background: var(--cyan-soft);  color: var(--cyan); }
.badge-rejected { background: var(--red-soft);   color: var(--red); }
.badge-denied   { background: #fecaca; color: #7f1d1d; }
.badge-active   { background: var(--green-soft); color: var(--green); }
.badge-inactive { background: var(--gray-soft);  color: #4b5563; }
.badge-role-admin  { background: var(--primary-soft); color: var(--primary); }
.badge-role-staff  { background: #e0e7ff; color: #3730a3; }
.badge-role-viewer { background: var(--gray-soft); color: #4b5563; }

.avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--primary-soft); color: var(--primary);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 0.8rem; font-weight: 700; flex-shrink: 0;
}
.avatar-lg { width: 56px; height: 56px; font-size: 1.1rem; }

/* ---------- Modal ---------- */
.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(17, 24, 39, 0.5);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 40px 16px; overflow-y: auto;
}
.modal-overlay-top { z-index: 120; align-items: center; }
.modal { background: #fff; border-radius: 8px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.2); animation: modal-in 0.15s ease-out; }
.modal-sm { max-width: 420px; }
.modal-md { max-width: 620px; }
.modal-lg { max-width: 860px; }
.modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.modal-header h3 { font-size: 1.05rem; font-weight: 600; }
.modal-body { padding: 20px; }
.modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--border); background: var(--page-bg); border-radius: 0 0 8px 8px; }
.confirm-message { line-height: 1.6; }
@keyframes modal-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

/* ---------- Toast ---------- */
#toast-root { position: fixed; bottom: 16px; right: 16px; z-index: 200; display: flex; flex-direction: column; gap: 10px; }
.toast {
  display: flex; align-items: center; gap: 10px; max-width: 360px;
  padding: 12px 16px; border-radius: var(--radius);
  background: #fff; border: 1px solid var(--border); border-left-width: 4px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.12); font-size: 0.92rem;
  animation: toast-in 0.2s ease-out;
}
.toast-success { border-left-color: var(--green); }
.toast-success .toast-icon { color: var(--green); }
.toast-error { border-left-color: var(--red); }
.toast-error .toast-icon { color: var(--red); }
.toast-info { border-left-color: var(--primary); }
.toast-info .toast-icon { color: var(--primary); }
.toast-icon { display: flex; }
.toast-hide { opacity: 0; transition: opacity 0.25s; }
@keyframes toast-in { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {
  .modal, .toast { animation: none; }
}

/* ===== dashboard.css ===== */

.stat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 20px; }

.stat-card {
  display: flex; align-items: center; gap: 14px; text-align: left;
  padding: 16px; background: var(--bg);
  border: 1px solid var(--border); border-radius: var(--radius);
}
.stat-card:hover { border-color: var(--primary); }
.stat-icon { width: 44px; height: 44px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.stat-text { display: flex; flex-direction: column; }
.stat-value { font-size: 1.7rem; font-weight: 700; line-height: 1.1; }
.stat-label { font-size: 0.85rem; color: var(--muted); }

.stat-total .stat-icon    { background: var(--primary-soft); color: var(--primary); }
.stat-approved .stat-icon { background: var(--green-soft);   color: var(--green); }
.stat-review .stat-icon   { background: var(--amber-soft);   color: var(--amber); }
.stat-survey .stat-icon   { background: var(--cyan-soft);    color: var(--cyan); }
.stat-rejected .stat-icon { background: var(--red-soft);     color: var(--red); }

.dash-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.dash-wide { grid-column: 1 / -1; }

/* Status overview bars */
.bar-row + .bar-row { margin-top: 14px; }
.bar-label { display: flex; justify-content: space-between; font-size: 0.88rem; margin-bottom: 4px; }
.bar-track { height: 10px; background: var(--sidebar-bg); border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 999px; min-width: 0; }
.bar-approved { background: #22c55e; }
.bar-review   { background: #f59e0b; }
.bar-survey   { background: #06b6d4; }
.bar-rejected { background: #ef4444; }
.bar-denied   { background: #991b1b; }

.quick-actions { display: flex; flex-wrap: wrap; gap: 10px; }

/* Recent activity */
.activity-list { list-style: none; margin: 0; padding: 4px 18px 8px; }
.activity-item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.activity-item:last-child { border-bottom: 0; }
.activity-icon { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--sidebar-bg); color: var(--muted); }
.activity-approved { background: var(--green-soft); color: var(--green); }
.activity-review   { background: var(--amber-soft); color: var(--amber); }
.activity-survey   { background: var(--cyan-soft);  color: var(--cyan); }
.activity-rejected, .activity-delete { background: var(--red-soft); color: var(--red); }
.activity-add, .activity-edit, .activity-user { background: var(--primary-soft); color: var(--primary); }
.activity-item p { font-size: 0.92rem; }

/* ===== forms.css ===== */

.form-card { padding: 24px; }
.form-section { border: 0; margin: 0 0 24px; padding: 0; min-width: 0; }
.form-section legend { font-size: 1rem; font-weight: 600; padding: 0 0 10px; margin-bottom: 14px; border-bottom: 1px solid var(--border); width: 100%; }

.form-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 20px; }
.form-group { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.form-group-wide { grid-column: 1 / -1; }
.form-group label { font-size: 0.86rem; font-weight: 500; }

input[type="text"], input[type="email"], input[type="tel"], input[type="date"],
input[type="search"], select, textarea {
  width: 100%; padding: 8px 10px;
  border: 1px solid #d1d5db; border-radius: var(--radius);
  background: #fff; font-size: 0.92rem;
}
textarea { resize: vertical; min-height: 76px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.15); }
input[readonly] { background: var(--sidebar-bg); color: var(--muted); cursor: not-allowed; }

.field-error { min-height: 0; font-size: 0.8rem; color: var(--red); }
.form-group.has-error input, .form-group.has-error select, .form-group.has-error textarea { border-color: var(--red); background: #fffafa; }

.form-actions { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 18px; border-top: 1px solid var(--border); }

/* ===== tables.css ===== */

.toolbar { padding: 16px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 14px; }

.search-box { position: relative; max-width: 460px; }
.search-box .icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search-box input { padding-left: 34px; }

.filter-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.filter-field { display: flex; flex-direction: column; gap: 4px; min-width: 150px; flex: 1 1 150px; max-width: 220px; }
.filter-field span { font-size: 0.78rem; color: var(--muted); }
.btn-reset { flex-shrink: 0; }

.table-card { overflow: hidden; }
.table-meta { padding: 12px 16px; font-size: 0.88rem; color: var(--muted); border-bottom: 1px solid var(--border); }
.table-wrap { overflow-x: auto; }

.data-table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
.data-table th, .data-table td { padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
.data-table thead th { background: var(--page-bg); font-weight: 600; font-size: 0.84rem; color: #374151; }
.data-table tbody tr:hover { background: #f8fafc; }
.data-table tbody tr:last-child td { border-bottom: 0; }
.cell-id { font-weight: 600; color: var(--primary); }
.col-actions { text-align: right !important; width: 1%; }
.row-actions { display: inline-flex; gap: 2px; }

th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--primary); }
th.sortable::after { content: ""; display: inline-block; margin-left: 6px; border: 4px solid transparent; vertical-align: middle; opacity: 0.25; border-top-color: currentColor; border-bottom-width: 0; }
th.sorted-asc::after  { border-top-width: 0; border-bottom: 5px solid currentColor; border-top-color: transparent; opacity: 1; }
th.sorted-desc::after { border-top: 5px solid currentColor; border-bottom-width: 0; opacity: 1; }

.empty-row:hover { background: transparent !important; }
.empty-state { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 32px 12px; text-align: center; color: var(--muted); white-space: normal; }
.empty-state strong { color: var(--text); font-weight: 500; }

.user-cell { display: flex; align-items: center; gap: 10px; }
.user-cell div { display: flex; flex-direction: column; line-height: 1.3; }
.user-cell small { font-size: 0.78rem; }

/* Profile windows */
.profile-head { display: flex; align-items: center; gap: 14px; padding-bottom: 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.profile-head h4 { font-size: 1.15rem; font-weight: 600; }
.profile-status { margin-left: auto; display: flex; gap: 6px; }
.detail-title { font-size: 0.95rem; font-weight: 600; margin: 20px 0 10px; }
.detail-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 20px; margin: 0; }
.detail { min-width: 0; }
.detail dt { font-size: 0.78rem; color: var(--muted); }
.detail dd { margin: 2px 0 0; font-size: 0.92rem; overflow-wrap: anywhere; }
.detail-wide { grid-column: 1 / -1; }

.ability-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ability-list li { font-size: 0.9rem; padding-left: 22px; position: relative; }
.ability-list li::before { position: absolute; left: 0; font-weight: 700; }
.ability-list li.yes::before { content: "\2713"; color: var(--green); }
.ability-list li.no { color: var(--muted); }
.ability-list li.no::before { content: "\2715"; color: var(--red); }

.role-card { margin-top: 16px; }
.role-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 18px; }
.role-item p { margin-top: 6px; font-size: 0.88rem; color: var(--muted); }

/* ===== responsive.css ===== */
/* ==========================================================
   responsive.css - laptop, tablet and small screens
   ========================================================== */
.main, .content, .page, #dashboard-root, #users-root, #dataform-root,
#records-root, #approved-root, #review-root, #survey-root, #rejected-root { min-width: 0; }

@media (min-width: 1200px) {
  .stat-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (min-width: 992px) and (max-width: 1199px) {
  .stat-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .content { padding: 24px; }
  .topbar { padding: 0 24px; }
}

@media (max-width: 991px) {
  .sidebar {
    width: min(var(--sidebar-width), calc(100vw - 48px));
    transform: translateX(-100%);
    transition: transform 0.2s ease;
    box-shadow: none;
  }
  body.sidebar-open .sidebar { transform: translateX(0); box-shadow: 4px 0 20px rgba(0,0,0,0.15); }
  body.sidebar-open .sidebar-backdrop {
    display: block;
    position: fixed;
    inset: 0;
    background: rgba(17,24,39,0.4);
    z-index: 25;
  }
  .main { margin-left: 0; }
  .topbar .menu-toggle { display: inline-flex; flex: 0 0 36px; }
  .topbar { padding: 0 20px; }
  .content { padding: 22px 20px; }
  .stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .form-grid, .detail-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 767px) {
  .topbar { gap: 10px; padding: 0 14px; }
  .content { padding: 18px 14px; }
  .dash-grid, .role-grid { grid-template-columns: minmax(0, 1fr); }
  .user-switcher { gap: 7px; }
  .user-switcher-text label, #current-user-role { display: none; }
  .user-switcher select { max-width: 140px; }
  .filter-field { max-width: none; }
  .search-box { max-width: none; width: 100%; }
  .page-header { align-items: stretch; }
  .page-actions, .form-actions { width: 100%; }
  .modal-overlay { padding: 16px 12px; }
  .modal { max-height: calc(100dvh - 32px); display: flex; flex-direction: column; }
  .modal-body { min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .modal-footer { flex-wrap: wrap; }
}

@media (max-width: 480px) {
  .topbar { gap: 8px; padding: 0 10px; }
  .page-title { min-width: 0; font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user-switcher { min-width: 0; }
  .user-switcher select { width: 100%; max-width: 104px; font-size: 0.82rem; }
  .content { padding: 16px 12px; }
  .page-header { margin-bottom: 16px; }
  .page-header h2 { font-size: 1.2rem; }
  .stat-grid { gap: 10px; }
  .stat-card { min-width: 0; gap: 9px; padding: 12px 10px; }
  .stat-icon { width: 36px; height: 36px; }
  .stat-value { font-size: 1.35rem; }
  .stat-label { font-size: 0.76rem; overflow-wrap: anywhere; }
  .form-grid, .detail-grid { grid-template-columns: minmax(0, 1fr); }
  .form-group-wide, .detail-wide { grid-column: auto; }
  .form-card { padding: 16px; }
  .form-actions, .page-actions { align-items: stretch; }
  .form-actions .btn, .page-actions .btn { flex: 1 1 100%; }
  .quick-actions .btn { flex: 1 1 100%; }
  .profile-status { margin-left: 0; }
  .card-header { gap: 8px; padding: 12px 14px; }
  .card-body { padding: 14px; }
  .table-wrap { max-width: 100%; overscroll-behavior-x: contain; }
  .data-table { min-width: 640px; }
  .data-table td:nth-child(2) { white-space: normal; min-width: 150px; overflow-wrap: anywhere; }
  .row-actions { gap: 4px; }

  <script>
/* ===== assets\js\storage.js ===== */
/* ==========================================================
   storage.js  -  Data layer (LocalStorage)
   All reading / writing of records goes through the DB object.
   Sample data from assets/data/*.js is copied into LocalStorage
   only once (first run). After that LocalStorage is the source
   of truth, so edits and deletions survive a browser refresh.
   ========================================================== */
var DB = (function () {
  "use strict";

  var KEYS = {
    applicants: "chdo_applicants",
    users: "chdo_users",
    activities: "chdo_activities",
    seeded: "chdo_seeded_v1",
    renamedUsers: "chdo_renamed_users_v1",
    applicantViewers: "chdo_applicant_viewers_v1",
    currentUser: "chdo_current_user"
  };

  /* Fallback memory store, used only if LocalStorage is blocked. */
  var memory = {};
  var storageWorks = (function () {
    try {
      localStorage.setItem("__chdo_test", "1");
      localStorage.removeItem("__chdo_test");
      return true;
    } catch (e) { return false; }
  })();

  function clone(value) { return JSON.parse(JSON.stringify(value)); }

  function read(key, fallback) {
    try {
      var raw = storageWorks ? localStorage.getItem(key) : memory[key];
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) {
      console.error("Could not read " + key, e);
      return fallback;
    }
  }

  function write(key, value) {
    var raw = JSON.stringify(value);
    if (!storageWorks) { memory[key] = raw; return true; }
    try { localStorage.setItem(key, raw); return true; }
    catch (e) { console.error("Could not save " + key, e); return false; }
  }

  function readFlag(key) { return storageWorks ? localStorage.getItem(key) : memory[key]; }
  function writeFlag(key, value) { if (storageWorks) localStorage.setItem(key, value); else memory[key] = value; }

  function todayISO() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }

  /* ---------- Setup ---------- */

  var RENAMED_USERS = {
    "Maria Santos": "Jaypee Planque",
    "Jose Reyes": "Yonjhel Calipayan",
    "Ana Villanueva": "Jelyn Mores",
    "Carlo Mendoza": "Emmanuel Conarco",
    "Liza Ramos": "Kenowev Amores",
    "Kenowev Mores": "Kenowev Amores"
  };

  function migrateRenamedUsers() {
    if (readFlag(KEYS.renamedUsers)) return;

    var users = getUsers();
    var usersChanged = false;
    users.forEach(function (user) {
      if (RENAMED_USERS[user.fullName]) {
        user.fullName = RENAMED_USERS[user.fullName];
        usersChanged = true;
      }
    });
    var usersSaved = !usersChanged || write(KEYS.users, users);

    var applicants = getApplicants();
    var applicantsChanged = false;
    applicants.forEach(function (applicant) {
      if (RENAMED_USERS[applicant.assignedStaff]) {
        applicant.assignedStaff = RENAMED_USERS[applicant.assignedStaff];
        applicantsChanged = true;
      }
    });
    var applicantsSaved = !applicantsChanged || write(KEYS.applicants, applicants);
    if (usersSaved && applicantsSaved) writeFlag(KEYS.renamedUsers, "1");
  }

  function migrateEmmanuelViewer() {
    var migrationKey = "chdo_emmanuel_viewer_v1";
    if (readFlag(migrationKey)) return;

    var users = getUsers();
    var user = users.filter(function (item) {
      return item.id === "USR-004" && item.fullName === "Emmanuel Conarco";
    })[0];
    if (user && user.role !== "Viewer") {
      user.role = "Viewer";
      if (!write(KEYS.users, users)) return;
    }
    writeFlag(migrationKey, "1");
  }

  function createViewerApplicant(user, applicants) {
    var nameParts = String(user.fullName || "").trim().split(/\s+/).filter(Boolean);
    var firstName = nameParts.shift() || "Viewer";
    var lastName = nameParts.length ? nameParts.pop() : "";
    return {
      id: generateApplicationIdFor(applicants),
      firstName: firstName,
      middleName: nameParts.join(" "),
      lastName: lastName,
      suffix: "",
      birthdate: "",
      age: "",
      sex: "",
      civilStatus: "",
      contactNumber: user.contactNumber || "",
      email: user.email || "",
      province: APP_CONFIG.formDefaults.province,
      city: APP_CONFIG.formDefaults.city,
      barangay: "",
      street: "",
      applicationDate: todayISO(),
      housingProgram: APP_CONFIG.housingPrograms[0],
      status: APP_CONFIG.defaultStatus,
      remarks: "Profile created for Viewer account.",
      assignedStaff: "",
      createdAt: new Date().toISOString()
    };
  }

  function seedApplicantViewers() {
    var users = getUsers();
    var applicants = getApplicants();
    var usersChanged = false;
    var applicantsChanged = false;
    var assignedApplicantIds = {};
    var sampleViewerProfiles = {
      "Kenowev Amores": "CHDO-2026-0021",
      "Emmanuel Conarco": "CHDO-2026-0022"
    };

    applicants.slice(0, 5).forEach(function (applicant) {
      if (users.some(function (user) {
        return user.role === "Viewer" && user.applicantId === applicant.id;
      })) return;

      var fullName = [applicant.firstName, applicant.middleName, applicant.lastName, applicant.suffix]
        .filter(Boolean).join(" ");
      users.push({
        id: generateUserIdFor(users),
        fullName: fullName,
        username: "a-" + String(applicant.id).toLowerCase(),
        email: applicant.email || "",
        contactNumber: applicant.contactNumber || "",
        position: "Applicant",
        role: "Viewer",
        status: "Active",
        dateCreated: todayISO(),
        applicantId: applicant.id
      });
      usersChanged = true;
    });

    Object.keys(sampleViewerProfiles).forEach(function (fullName) {
      var profileId = sampleViewerProfiles[fullName];
      var profile = applicants.filter(function (applicant) { return applicant.id === profileId; })[0];
      if (!profile) {
        profile = (window.SAMPLE_APPLICANTS || []).filter(function (applicant) {
          return applicant.id === profileId;
        })[0];
        if (profile) {
          applicants.push(clone(profile));
          applicantsChanged = true;
        }
      }
    });

    users.forEach(function (user) {
      if (user.fullName === "Kenowev Mores") {
        user.fullName = "Kenowev Amores";
        usersChanged = true;
      }
      if (user.role !== "Viewer") return;

      var sampleProfileId = sampleViewerProfiles[user.fullName];
      var linkedApplicant = sampleProfileId
        ? applicants.filter(function (applicant) { return applicant.id === sampleProfileId; })[0]
        : applicants.filter(function (applicant) { return applicant.id === user.applicantId; })[0];

      if (!linkedApplicant || assignedApplicantIds[linkedApplicant.id]) {
        linkedApplicant = applicants.filter(function (applicant) {
          return !assignedApplicantIds[applicant.id] &&
            [applicant.firstName, applicant.middleName, applicant.lastName, applicant.suffix]
              .filter(Boolean).join(" ").toLowerCase() === user.fullName.toLowerCase();
        })[0];
      }

      if (!linkedApplicant || assignedApplicantIds[linkedApplicant.id]) {
        linkedApplicant = createViewerApplicant(user, applicants);
        applicants.push(linkedApplicant);
        applicantsChanged = true;
      }

      assignedApplicantIds[linkedApplicant.id] = true;
      if (user.applicantId !== linkedApplicant.id) {
        user.applicantId = linkedApplicant.id;
        usersChanged = true;
      }
    });

    var applicantsSaved = !applicantsChanged || write(KEYS.applicants, applicants);
    var usersSaved = !usersChanged || write(KEYS.users, users);
    if (applicantsSaved && usersSaved) writeFlag(KEYS.applicantViewers, "1");
  }

  /** Copy the sample data into LocalStorage the first time only. */
  function init() {
    if (!readFlag(KEYS.seeded)) {
      write(KEYS.applicants, clone(window.SAMPLE_APPLICANTS || []));
      write(KEYS.users, clone(window.SAMPLE_USERS || []));
      write(KEYS.activities, clone(window.SAMPLE_ACTIVITIES || []));
      writeFlag(KEYS.seeded, "1");
    }
    migrateRenamedUsers();
    migrateEmmanuelViewer();
    seedApplicantViewers();
  }

  /** Remove everything and load the sample data again. */
  function resetAll() {
    if (storageWorks) {
      Object.keys(KEYS).forEach(function (name) { localStorage.removeItem(KEYS[name]); });
    } else { memory = {}; }
    init();
  }

  /* ---------- Applicants ---------- */

  function getApplicants() { return read(KEYS.applicants, []); }

  function getApplicant(id) {
    return getApplicants().filter(function (a) { return a.id === id; })[0] || null;
  }

  function applicantIdExists(id) { return !!getApplicant(id); }

  /** Next ID in the form CHDO-YYYY-0001 (never reuses an existing ID). */
  function generateApplicationId() {
    return generateApplicationIdFor(getApplicants());
  }

  function generateApplicationIdFor(applicants) {
    var prefix = "CHDO-" + new Date().getFullYear() + "-";
    var highest = 0;
    applicants.forEach(function (a) {
      if (a.id.indexOf(prefix) === 0) {
        var n = parseInt(a.id.slice(prefix.length), 10);
        if (!isNaN(n) && n > highest) highest = n;
      }
    });
    return prefix + String(highest + 1).padStart(4, "0");
  }

  /**
   * Insert (isNew = true) or update (isNew = false) an applicant.
   * Returns { ok: true } or { ok: false, error: "message" }.
   */
  function saveApplicant(record, isNew) {
    var list = getApplicants();
    var index = -1;
    list.forEach(function (a, i) { if (a.id === record.id) index = i; });

    if (isNew) {
      if (index !== -1) return { ok: false, error: "Application ID " + record.id + " already exists." };
      list.push(record);
    } else {
      if (index === -1) return { ok: false, error: "Record " + record.id + " was not found." };
      list[index] = record;
    }
    return write(KEYS.applicants, list) ? { ok: true } : { ok: false, error: "Browser storage is full or blocked." };
  }

  function deleteApplicant(id) {
    var list = getApplicants();
    var remaining = list.filter(function (a) { return a.id !== id; });
    if (remaining.length === list.length) return false;
    return write(KEYS.applicants, remaining);
  }

  /* ---------- Users ---------- */

  function getUsers() { return read(KEYS.users, []); }

  function getUser(id) {
    return getUsers().filter(function (u) { return u.id === id; })[0] || null;
  }

  function generateUserId() {
    return generateUserIdFor(getUsers());
  }

  function generateUserIdFor(users) {
    var highest = 0;
    users.forEach(function (u) {
      var n = parseInt(String(u.id).replace("USR-", ""), 10);
      if (!isNaN(n) && n > highest) highest = n;
    });
    return "USR-" + String(highest + 1).padStart(3, "0");
  }

  /** Insert or update a user. Usernames and e-mails must be unique. */
  function saveUser(user, isNew) {
    var list = getUsers();
    var applicants = getApplicants();
    var index = -1;
    list.forEach(function (u, i) { if (u.id === user.id) index = i; });

    var clash = list.filter(function (u) {
      return u.id !== user.id && u.username.toLowerCase() === user.username.toLowerCase();
    })[0];
    if (clash) return { ok: false, error: "Username \"" + user.username + "\" is already taken." };

    if (user.email) {
      var emailClash = list.filter(function (u) {
        return u.id !== user.id && u.email && u.email.toLowerCase() === user.email.toLowerCase();
      })[0];
      if (emailClash) return { ok: false, error: "E-mail \"" + user.email + "\" is already used by another user." };
    }

    if (isNew) {
      if (index !== -1) return { ok: false, error: "User ID " + user.id + " already exists." };
    } else {
      if (index === -1) return { ok: false, error: "User was not found." };
    }

    if (user.role === "Viewer" && !user.applicantId) {
      var applicant = createViewerApplicant(user, applicants);
      if (!write(KEYS.applicants, applicants.concat([applicant]))) {
        return { ok: false, error: "The Viewer profile could not be saved because browser storage is full or blocked." };
      }
      user.applicantId = applicant.id;
    }

    if (isNew) list.push(user);
    else list[index] = user;
    return write(KEYS.users, list) ? { ok: true } : { ok: false, error: "Browser storage is full or blocked." };
  }

  function deleteUser(id) {
    var list = getUsers();
    var remaining = list.filter(function (u) { return u.id !== id; });
    if (remaining.length === list.length) return false;
    return write(KEYS.users, remaining);
  }

  /* ---------- Current (signed-in) user ---------- */

  function getCurrentUserId() { return readFlag(KEYS.currentUser) || ""; }
  function setCurrentUserId(id) { writeFlag(KEYS.currentUser, id); }

  /* ---------- Activity log ---------- */

  function getActivities(limit) {
    var list = read(KEYS.activities, []).slice().sort(function (a, b) {
      return a.timestamp < b.timestamp ? 1 : a.timestamp > b.timestamp ? -1 : 0;
    });
    return limit ? list.slice(0, limit) : list;
  }

  /** Add an entry to the Recent Activity list (keeps the latest 50). */
  function logActivity(type, message, userName) {
    var list = read(KEYS.activities, []);
    var now = new Date();
    var stamp = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" +
      String(now.getDate()).padStart(2, "0") + "T" + String(now.getHours()).padStart(2, "0") + ":" +
      String(now.getMinutes()).padStart(2, "0") + ":" + String(now.getSeconds()).padStart(2, "0");
    list.push({
      id: "ACT-" + Date.now(),
      type: type,
      message: message,
      user: userName || "System",
      timestamp: stamp
    });
    list.sort(function (a, b) { return a.timestamp < b.timestamp ? 1 : -1; });
    write(KEYS.activities, list.slice(0, 50));
  }

  return {
    init: init, resetAll: resetAll, todayISO: todayISO,
    getApplicants: getApplicants, getApplicant: getApplicant, applicantIdExists: applicantIdExists,
    generateApplicationId: generateApplicationId, saveApplicant: saveApplicant, deleteApplicant: deleteApplicant,
    getUsers: getUsers, getUser: getUser, generateUserId: generateUserId, saveUser: saveUser, deleteUser: deleteUser,
    getCurrentUserId: getCurrentUserId, setCurrentUserId: setCurrentUserId,
    getActivities: getActivities, logActivity: logActivity
  };
})();

</script>

/* ==========================================================
   app.js  -  Shared helpers and application start-up
   Utils : small formatting / validation helpers
   App   : icons, permissions, toast, modal, confirm dialog
   ========================================================== */
var Utils = (function () {
  "use strict";

  /** Escape text so it is safe to put inside HTML. */
  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  /** "2026-11-09" -> "Nov 9, 2026" */
  function formatDate(iso) {
    if (!iso) return "-";
    var p = String(iso).slice(0, 10).split("-");
    if (p.length !== 3) return iso;
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    return d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
  }

  /** "2026-11-09T14:05:00" -> "Nov 9, 2026, 2:05 PM" */
  function formatDateTime(iso) {
    if (!iso) return "-";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleString("en-US", { year: "numeric", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  }

  /** Age in whole years from a YYYY-MM-DD birthdate. */
  function computeAge(birthdate) {
    if (!birthdate) return "";
    var p = birthdate.split("-");
    if (p.length !== 3) return "";
    var today = new Date();
    var age = today.getFullYear() - Number(p[0]);
    var monthDiff = today.getMonth() + 1 - Number(p[1]);
    if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < Number(p[2]))) age--;
    return age;
  }

  /** "Maria Luisa Santos Dela Cruz Jr." (fields stay separate in storage) */
  function fullName(a) {
    return [a.firstName, a.middleName, a.lastName, a.suffix].filter(Boolean).join(" ");
  }

  function statusInfo(status) {
    var list = APP_CONFIG.statuses;
    for (var i = 0; i < list.length; i++) if (list[i].value === status) return list[i];
    return { value: status, css: "review", section: "review" };
  }

  function statusBadge(status) {
    return '<span class="badge badge-' + statusInfo(status).css + '">' + esc(status) + "</span>";
  }

  function initials(name) {
    return String(name || "?").split(/\s+/).filter(Boolean).slice(0, 2)
      .map(function (w) { return w.charAt(0).toUpperCase(); }).join("");
  }

  function isValidEmail(value) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value); }
  function isValidPhone(value) { return /^[0-9+\-\s()]{7,15}$/.test(value); }

  function optionsHTML(list, selected, placeholder) {
    var html = placeholder ? '<option value="">' + esc(placeholder) + "</option>" : "";
    list.forEach(function (item) {
      html += '<option value="' + esc(item) + '"' + (item === selected ? " selected" : "") + ">" + esc(item) + "</option>";
    });
    return html;
  }

  function debounce(fn, wait) {
    var timer;
    return function () {
      var args = arguments, ctx = this;
      clearTimeout(timer);
      timer = setTimeout(function () { fn.apply(ctx, args); }, wait);
    };
  }

  return {
    esc: esc, formatDate: formatDate, formatDateTime: formatDateTime, computeAge: computeAge,
    fullName: fullName, statusInfo: statusInfo, statusBadge: statusBadge, initials: initials,
    isValidEmail: isValidEmail, isValidPhone: isValidPhone, optionsHTML: optionsHTML, debounce: debounce
  };
})();

    trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
    search: '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
    menu: '<line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>',
