  font-family: "Poppins", sans-serif;
  color: var(--text);
  background: var(--page-bg);
  line-height: 1.5;
}
body.modal-open { overflow: hidden; }

h1, h2, h3, h4, h5, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }

:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

.icon { flex-shrink: 0; vertical-align: middle; }
.muted { color: var(--muted); }
.req { color: var(--red); }

/* ---------- Layout ---------- */
.app-shell { min-height: 100vh; display: flex; }

.brand-mark { width: 36px; height: 36px; border-radius: var(--radius); object-fit: contain; flex-shrink: 0; }
.brand-text { display: flex; flex-direction: column; line-height: 1.2; }
.brand-text strong { font-size: 0.95rem; }
.brand-text span { font-size: 0.8rem; color: var(--muted); }

.sidebar { position: fixed; inset: 0 auto 0 0; z-index: 30; display: flex; flex-direction: column; width: 256px; padding: 0 8px 8px; overflow-y: auto; background: var(--sidebar-bg); border-right: 1px solid var(--border); }
.sidebar-header { display: flex; flex: 0 0 68px; height: 68px; align-items: center; gap: 8px; margin-bottom: 0; padding: 0 4px; border-bottom: 1px solid var(--border); }
.topbar-brand { display: flex; flex: 1 1 auto; align-items: center; gap: 8px; min-width: 0; margin-right: auto; }
.topbar-brand .brand-mark { width: 42px; height: 42px; }
.topbar-brand .brand-text strong { color: #fff; font-size: 0.9rem; font-weight: 700; letter-spacing: 0.015em; }
.topbar-brand .brand-text span { color: #f8dde1; font-size: 0.72rem; font-weight: 500; letter-spacing: 0.01em; }

.top-nav { display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 4px; min-width: 0; overflow: visible; padding: 0; }
.nav-dropdown { position: relative; width: 100%; min-width: 0; }
.nav-dropdown > summary { display: flex; width: 100%; list-style: none; cursor: pointer; }
.nav-dropdown > summary::-webkit-details-marker { display: none; }
.nav-dropdown > summary .nav-label { flex: 1 1 auto; }
.nav-arrow { width: 6px; height: 6px; margin: -3px 1px 0 2px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); transition: transform 0.15s, margin 0.15s; }
.nav-dropdown[open] .nav-arrow { margin-top: 4px; transform: rotate(225deg); }
.nav-item {
  display: flex; align-items: center; justify-content: flex-start;
  width: 100%; min-height: 40px; gap: 9px; padding: 8px 10px; border: 0; border-radius: 6px;
  background: transparent; color: #6b7280; white-space: normal; text-align: left;
  transition: background-color 0.15s, color 0.15s;
}
.nav-item:hover { background: #f3f6fb; color: var(--text); }
.nav-item.active { background: #630A19; color: #fff; font-weight: 600; }
.nav-icon { display: inline-flex; width: 18px; align-items: center; justify-content: center; }
.nav-label { flex: 1 1 auto; min-width: 0; font-size: 0.88rem; }
.nav-section-label { grid-column: 1 / -1; padding: 12px 10px 4px; color: var(--muted); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; }
.nav-count {
  min-width: 19px; padding: 0 4px; border-radius: 999px;
  background: #f3f4f6; border: 1px solid var(--border);
  font-size: 0.68rem; text-align: center; color: var(--muted);
}
.nav-item.active .nav-count { background: rgba(255,255,255,0.2); border-color: transparent; color: #fff; }
.nav-menu {
  display: flex; flex-direction: column; gap: 2px; min-width: 0; max-width: none;
  padding: 4px 0 0 12px;
}
.nav-menu .nav-item { min-height: 38px; padding: 7px 9px; border-radius: 4px; }
.nav-menu .nav-count { margin-left: auto; }

.main { min-height: 100vh; display: flex; flex: 1 1 auto; flex-direction: column; width: calc(100% - 256px); margin-left: 256px; }
.sidebar-collapsed .sidebar { width: 72px; padding-right: 8px; padding-left: 8px; }
.sidebar-collapsed .main { width: calc(100% - 72px); margin-left: 72px; }
.sidebar-collapsed .sidebar-header { justify-content: center; padding-right: 0; padding-left: 0; }
.sidebar-collapsed .nav-label,
.sidebar-collapsed .nav-section-label,
.sidebar-collapsed .nav-count,
.sidebar-collapsed .nav-arrow { display: none; }
.sidebar-collapsed .nav-item { justify-content: center; padding-right: 8px; padding-left: 8px; }
body.viewer-mode .content { display: flex; justify-content: center; max-width: none; }
body.viewer-mode .content > .page { width: 100%; max-width: 900px; }

.topbar {
  position: sticky; top: 0; z-index: 20;
  min-height: 68px;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 20px;
  background: #630A19; color: #fff; border-bottom: 1px solid #4d0814;
  box-shadow: 0 2px 8px rgba(15, 23, 42, 0.12);
}
.sidebar-toggle { flex-shrink: 0; }
.topbar .icon-btn { color: #fff; }
.topbar .icon-btn:hover { background: rgba(255,255,255,0.14); color: #fff; }

.user-switcher { display: flex; align-items: center; gap: 8px; }
.topbar .user-switcher { flex: 0 0 auto; }
.user-switcher-text { display: flex; flex-direction: column; line-height: 1.2; }
.user-switcher select { border: 0; background: transparent; font-size: 0.88rem; font-weight: 600; padding: 0; max-width: 260px; cursor: pointer; }
.topbar .user-switcher select { color: #fff; }
.topbar .user-switcher select option { color: var(--text); background: #fff; }
.topbar .avatar,
.topbar .badge-role-admin,
.topbar .badge-role-staff,
.topbar .badge-role-viewer { background: rgba(255,255,255,0.16); color: #fff; }

.content { flex: 1; padding: 20px 22px; max-width: 1600px; width: 100%; }

.page-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.page-header h2 { font-size: 1.4rem; font-weight: 600; }
.page-header p { color: var(--muted); margin-top: 2px; }
.page-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.readonly-note { font-size: 0.85rem; color: var(--muted); background: var(--sidebar-bg); padding: 5px 10px; border-radius: var(--radius); }

.card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 3px 12px rgba(15, 23, 42, 0.035); }
.card-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; border-bottom: 1px solid var(--border); }
.card-header h3 { font-size: 1rem; font-weight: 600; }
.card-body { padding: 15px; }
.notice { padding: 18px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  padding: 7px 13px; border-radius: 4px;
  border: 1px solid transparent; font-weight: 500; font-size: 0.92rem;
  transition: background-color 0.15s, border-color 0.15s;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-secondary { background: #fff; border-color: #d1d5db; color: var(--text); }
.btn-secondary:hover { background: var(--sidebar-bg); }
.btn-danger { background: var(--red); color: #fff; }
.btn-danger:hover { background: #991b1b; }
.btn-ghost { background: transparent; color: var(--muted); }
.btn-ghost:hover { background: var(--sidebar-bg); color: var(--text); }
.btn-link { background: transparent; border: 0; color: var(--primary); padding: 4px 6px; }
.btn-link:hover { text-decoration: underline; }

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 4px;
  border: 1px solid transparent; background: transparent; color: var(--muted);
}
.icon-btn:hover { background: var(--sidebar-bg); color: var(--primary); }
.icon-btn-danger:hover { background: var(--red-soft); color: var(--red); }

/* ---------- Badges ---------- */
.badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; white-space: nowrap; }
.badge-approved { background: transparent; color: var(--green); padding: 0; border-radius: 0; }
.badge-review   { background: transparent; color: var(--amber); padding: 0; border-radius: 0; }
.badge-survey   { background: transparent; color: var(--cyan);  padding: 0; border-radius: 0; }
.badge-rejected { background: transparent; color: var(--red);   padding: 0; border-radius: 0; }
.badge-denied   { background: transparent; color: #7f1d1d; padding: 0; border-radius: 0; }
.badge-for-review { color: var(--text); text-transform: uppercase; }
.badge-active   { background: var(--green-soft); color: var(--green); }
.badge-inactive { background: var(--gray-soft);  color: #4b5563; }
.badge-role-admin  { background: var(--primary-soft); color: var(--primary); }
.badge-role-staff  { background: #e0e7ff; color: #3730a3; }
.badge-role-viewer { background: var(--gray-soft); color: #4b5563; }

.avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--primary-soft); color: var(--primary);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 0.8rem; font-weight: 700; flex-shrink: 0;
}
.avatar-lg { width: 56px; height: 56px; font-size: 1.1rem; }

/* ---------- Modal ---------- */
.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(17, 24, 39, 0.5);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 24px 12px; overflow-y: auto;
}
.modal-overlay-top { z-index: 120; align-items: center; }
.modal { background: #fff; border-radius: 8px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.2); animation: modal-in 0.15s ease-out; }
.modal-sm { max-width: 420px; }
.modal-md { max-width: 620px; }
.modal-lg { max-width: 860px; }
.modal-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.modal-header h3 { font-size: 1.05rem; font-weight: 600; }
.modal-body { padding: 16px; }
.modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 11px 16px; border-top: 1px solid var(--border); background: var(--page-bg); border-radius: 0 0 8px 8px; }
.confirm-message { line-height: 1.6; }
@keyframes modal-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

/* ---------- Toast ---------- */
#toast-root { position: fixed; bottom: 16px; right: 16px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast {
  display: flex; align-items: center; gap: 8px; max-width: 360px;
  padding: 10px 13px; border-radius: var(--radius);
  background: #fff; border: 1px solid var(--border); border-left-width: 4px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.12); font-size: 0.92rem;
  animation: toast-in 0.2s ease-out;
}
.toast-success { border-left-color: var(--green); }
.toast-success .toast-icon { color: var(--green); }
.toast-error { border-left-color: var(--red); }
.toast-error .toast-icon { color: var(--red); }
.toast-info { border-left-color: var(--primary); }
.toast-info .toast-icon { color: var(--primary); }
.toast-icon { display: flex; }
.toast-hide { opacity: 0; transition: opacity 0.25s; }
@keyframes toast-in { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {
  .modal, .toast { animation: none; }
}

/* ===== dashboard.css ===== */

.stat-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }

.stat-card {
  display: flex; flex-direction: row; align-items: center; gap: 12px; text-align: left;
  min-height: 72px; padding: 11px 12px; background: var(--bg);
  border: 1px solid var(--border); border-radius: 6px;
  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
  transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
}
.stat-card:hover { border-color: #bfdbfe; box-shadow: 0 8px 20px rgba(15, 23, 42, 0.07); transform: translateY(-2px); }
.stat-icon { width: 36px; height: 36px; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.stat-text { display: flex; flex-direction: column; }
.stat-value { font-size: 1.4rem; font-weight: 700; line-height: 1.1; letter-spacing: -0.035em; }
.stat-label { font-size: 0.78rem; color: var(--muted); }

.stat-total .stat-icon    { background: var(--primary-soft); color: var(--primary); }
.stat-approved .stat-icon { background: var(--green-soft);   color: var(--green); }
.stat-review .stat-icon   { background: var(--amber-soft);   color: var(--amber); }
.stat-survey .stat-icon   { background: var(--cyan-soft);    color: var(--cyan); }
.stat-rejected .stat-icon { background: var(--red-soft);     color: var(--red); }

.dash-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(320px, 1fr); gap: 12px; }
.dash-wide { grid-column: 1 / -1; }
#dashboard-root .card { border-radius: 6px; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04); }

/* Status overview bars */
.bar-row + .bar-row { margin-top: 10px; }
.bar-label { display: flex; justify-content: space-between; font-size: 0.88rem; margin-bottom: 3px; }
.bar-track { height: 10px; background: var(--sidebar-bg); border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 999px; min-width: 0; }
.bar-approved { background: #22c55e; }
.bar-review   { background: #f59e0b; }
.bar-survey   { background: #06b6d4; }
.bar-rejected { background: #ef4444; }
.bar-denied   { background: #991b1b; }
.status-overview .bar-payment-approved { background: #630A19; }
.status-overview .bar-payment-review { background: rgba(99, 10, 25, 0.65); }
.status-overview .bar-payment-survey { background: rgba(99, 10, 25, 0.5); }

.quick-actions { display: flex; flex-wrap: wrap; gap: 8px; }

.dashboard-heading { margin-bottom: 12px; }
.dashboard-heading h2 { font-size: 1.2rem; }
.dashboard-heading p { margin-top: 2px; }
.analytics-card, .status-card { min-width: 0; }
.program-status-group + .program-status-group { margin-top: 7px; padding-top: 5px; border-top: 1px solid var(--border); }
.program-status-group h4 { margin-bottom: 4px; font-size: 0.82rem; font-weight: 600; }
.status-overview .bar-row { display: grid; grid-template-columns: minmax(0, 1fr) auto clamp(72px, 9vw, 160px); align-items: center; gap: 6px; margin-top: 4px; }
.status-overview .bar-label { display: contents; font-size: 0.78rem; }
.status-overview .bar-label span:last-child { white-space: nowrap; text-align: right; }
.status-overview .bar-track { height: 5px; }
.analytics-card .card-header, .status-card .card-header { min-height: 48px; padding: 10px 14px; }
.analytics-card .card-header p { color: var(--muted); font-size: 0.8rem; }
.analytics-body { padding: 12px; }
.trend-chart { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); align-items: end; gap: 9px; min-height: 190px; padding: 7px 0 0; }
.trend-column { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; min-width: 0; height: 180px; }
.trend-column strong { font-size: 0.8rem; font-weight: 600; color: #4b5563; }
.trend-track { display: flex; align-items: flex-end; justify-content: center; width: 100%; height: 120px; border-bottom: 1px solid var(--border); background: linear-gradient(to top, #f8fafc, #fff); border-radius: 7px 7px 0 0; }
.trend-bar { display: block; width: min(34px, 65%); min-height: 0; border-radius: 6px 6px 0 0; background: rgba(99, 10, 25, 0.65); transition: height 0.25s ease; }
.trend-column:last-child .trend-bar { background: #630A19; }
.trend-column small { font-size: 0.74rem; color: var(--muted); white-space: nowrap; }
.dashboard-lower { margin-top: 12px; }
.recent-card { overflow: hidden; }
.recent-card .card-header { padding: 10px 14px; }
.recent-card .data-table thead th { background: #f8fafc; text-transform: uppercase; }
.recent-card .data-table td, .recent-card .data-table th { padding: 8px 12px; }
.dashboard-lower .card { min-width: 0; }
.dashboard-lower .card-header { min-height: 48px; }

/* Recent activity */
.activity-list { list-style: none; margin: 0; padding: 3px 14px 6px; }
.activity-item { display: flex; gap: 9px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.activity-item:last-child { border-bottom: 0; }
.activity-icon { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--sidebar-bg); color: var(--muted); }
.activity-approved { background: var(--green-soft); color: var(--green); }
.activity-review   { background: var(--amber-soft); color: var(--amber); }
.activity-survey   { background: var(--cyan-soft);  color: var(--cyan); }
.activity-rejected, .activity-delete { background: var(--red-soft); color: var(--red); }
.activity-add, .activity-edit, .activity-user { background: var(--primary-soft); color: var(--primary); }
.activity-item p { font-size: 0.92rem; }

/* ===== forms.css ===== */

.form-card { padding: 18px; }
.form-section { border: 0; margin: 0 0 18px; padding: 0; min-width: 0; }
.form-section legend { font-size: 1rem; font-weight: 600; padding: 0 0 8px; margin-bottom: 10px; border-bottom: 1px solid var(--border); width: 100%; }

.form-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 16px; }
.program-choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.program-choice-grid .btn { width: 100%; }
.core-details-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(180px, 1fr); gap: 12px 16px; }
.form-group { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.form-group-wide { grid-column: 1 / -1; }
.form-group label { font-size: 0.86rem; font-weight: 500; }

input[type="text"], input[type="email"], input[type="tel"], input[type="date"],
input[type="search"], select, textarea {
  width: 100%; padding: 7px 9px;
  border: 1px solid #d1d5db; border-radius: 4px;
  background: #fff; font-size: 0.92rem;
}
textarea { resize: vertical; min-height: 76px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.15); }
input[readonly] { background: var(--sidebar-bg); color: var(--muted); cursor: not-allowed; }

.field-error { min-height: 0; font-size: 0.8rem; color: var(--red); }
.form-group.has-error input, .form-group.has-error select, .form-group.has-error textarea { border-color: var(--red); background: #fffafa; }

.form-actions { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 14px; border-top: 1px solid var(--border); }

/* ===== tables.css ===== */

.toolbar { padding: 12px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; }

.search-box { position: relative; max-width: 460px; }
.search-box .icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search-box input { padding-left: 34px; }

.filter-row { display: flex; flex-wrap: wrap; gap: 9px; align-items: flex-end; }
.filter-field { display: flex; flex-direction: column; gap: 3px; min-width: 150px; flex: 1 1 150px; max-width: 220px; }
.filter-field span { font-size: 0.78rem; color: var(--muted); }
.filter-field input[type="date"] { height: 36px; box-sizing: border-box; }
.btn-reset { flex-shrink: 0; }

.table-card { overflow: hidden; }
.table-meta { padding: 9px 12px; font-size: 0.88rem; color: var(--muted); border-bottom: 1px solid var(--border); }
.table-wrap { overflow-x: auto; }

.data-table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
.data-table th, .data-table td { padding: 8px 11px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
.data-table thead th { background: var(--page-bg); font-weight: 600; font-size: 0.84rem; color: #374151; }
#records-root .data-table thead th,
#approved-root .data-table thead th,
#review-root .data-table thead th,
#survey-root .data-table thead th,
#rejected-root .data-table thead th { text-transform: uppercase; }
.data-table tbody tr:hover { background: #f8fafc; }
.data-table tbody tr:last-child td { border-bottom: 0; }
.cell-id { font-weight: 600; color: var(--primary); }
.col-actions { text-align: right !important; width: 1%; }
.row-actions { display: inline-flex; gap: 2px; }

th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--primary); }
th.sortable::after { content: ""; display: inline-block; margin-left: 6px; border: 4px solid transparent; vertical-align: middle; opacity: 0.25; border-top-color: currentColor; border-bottom-width: 0; }
th.sorted-asc::after  { border-top-width: 0; border-bottom: 5px solid currentColor; border-top-color: transparent; opacity: 1; }
th.sorted-desc::after { border-top: 5px solid currentColor; border-bottom-width: 0; opacity: 1; }

.empty-row:hover { background: transparent !important; }
.empty-state { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 24px 10px; text-align: center; color: var(--muted); white-space: normal; }
.empty-state strong { color: var(--text); font-weight: 500; }

.user-cell { display: flex; align-items: center; gap: 8px; }
.user-cell div { display: flex; flex-direction: column; line-height: 1.3; }
.user-cell small { font-size: 0.78rem; }

/* Profile windows */
.profile-head { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.profile-head h4 { font-size: 1.15rem; font-weight: 600; }
.profile-status { margin-left: auto; display: flex; gap: 5px; }
.detail-title { font-size: 0.95rem; font-weight: 600; margin: 15px 0 8px; }
.detail-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 16px; margin: 0; }
.detail { min-width: 0; }
.detail dt { font-size: 0.78rem; color: var(--muted); }
.detail dd { margin: 1px 0 0; font-size: 0.92rem; overflow-wrap: anywhere; }
.detail-wide { grid-column: 1 / -1; }

.ability-list li.yes::before { content: "\2713"; color: var(--green); }
.ability-list li.no { color: var(--muted); }
.ability-list li.no::before { content: "\2715"; color: var(--red); }

.role-card { margin-top: 12px; }
.role-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 14px; }
.role-item p { margin-top: 4px; font-size: 0.88rem; color: var(--muted); }

/* ===== responsive.css ===== */
/* ==========================================================
   responsive.css - laptop, tablet and small screens
   ========================================================== */
.main, .content, .page, #dashboard-root, #users-root, #dataform-root,
#records-root, #approved-root, #review-root, #survey-root, #rejected-root { min-width: 0; }

  .stat-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }

}

@media (min-width: 992px) and (max-width: 1199px) {
  .stat-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }

  .content { padding: 18px 16px; }
  .stat-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .dash-grid { grid-template-columns: minmax(0, 1.2fr) minmax(260px, 0.9fr); }
  .form-grid, .detail-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 767px) {

  .core-details-grid { grid-template-columns: minmax(0, 1fr); }

  .modal-footer { flex-wrap: wrap; }
}

@media (max-width: 480px) {

  .modal-footer { padding: 10px 11px; flex-direction: column-reverse; }

  .toast { max-width: none; }
}

  <script>
/* ===== assets\js\storage.js ===== */
/* ==========================================================
   storage.js  -  Data layer (LocalStorage)
   All reading / writing of records goes through the DB object.
   Sample data from assets/data/*.js is copied into LocalStorage
   only once (first run). After that LocalStorage is the source
   of truth, so edits and deletions survive a browser refresh.
   ========================================================== */
var DB = (function () {
  "use strict";

  var KEYS = {
    applicants: "chdo_applicants",
    users: "chdo_users",
    activities: "chdo_activities",
    seeded: "chdo_seeded_v1",
    renamedUsers: "chdo_renamed_users_v1",
    applicantViewers: "chdo_applicant_viewers_v1",
    currentUser: "chdo_current_user"
  };

  /* Fallback memory store, used only if LocalStorage is blocked. */
  var memory = {};
  var storageWorks = (function () {
    try {
      localStorage.setItem("__chdo_test", "1");
      localStorage.removeItem("__chdo_test");
      return true;
    } catch (e) { return false; }
  })();

  function clone(value) { return JSON.parse(JSON.stringify(value)); }

  function read(key, fallback) {
    try {
      var raw = storageWorks ? localStorage.getItem(key) : memory[key];
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) {
      console.error("Could not read " + key, e);
      return fallback;
    }
  }

  function write(key, value) {
    var raw = JSON.stringify(value);
    if (!storageWorks) { memory[key] = raw; return true; }
    try { localStorage.setItem(key, raw); return true; }
    catch (e) { console.error("Could not save " + key, e); return false; }
  }

  function readFlag(key) { return storageWorks ? localStorage.getItem(key) : memory[key]; }
  function writeFlag(key, value) { if (storageWorks) localStorage.setItem(key, value); else memory[key] = value; }

  function todayISO() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }

  /* ---------- Setup ---------- */

  var RENAMED_USERS = {
    "Maria Santos": "Jaypee Planque",
    "Jose Reyes": "Yonjhel Calipayan",
    "Ana Villanueva": "Jelyn Mores",
    "Carlo Mendoza": "Emmanuel Conarco",
    "Liza Ramos": "Kenowev Amores",
    "Kenowev Mores": "Kenowev Amores"
  };

  function migrateRenamedUsers() {
    if (readFlag(KEYS.renamedUsers)) return;

    var users = getUsers();
    var usersChanged = false;
    users.forEach(function (user) {
      if (RENAMED_USERS[user.fullName]) {
        user.fullName = RENAMED_USERS[user.fullName];
        usersChanged = true;
      }
    });
    var usersSaved = !usersChanged || write(KEYS.users, users);

    var applicants = getApplicants();
    var applicantsChanged = false;
    applicants.forEach(function (applicant) {
      if (RENAMED_USERS[applicant.assignedStaff]) {
        applicant.assignedStaff = RENAMED_USERS[applicant.assignedStaff];
        applicantsChanged = true;
      }
    });
    var applicantsSaved = !applicantsChanged || write(KEYS.applicants, applicants);
    if (usersSaved && applicantsSaved) writeFlag(KEYS.renamedUsers, "1");
  }

  function migrateEmmanuelViewer() {
    var migrationKey = "chdo_emmanuel_viewer_v1";
    if (readFlag(migrationKey)) return;

    var users = getUsers();
    var user = users.filter(function (item) {
      return item.id === "USR-004" && item.fullName === "Emmanuel Conarco";
    })[0];
    if (user && user.role !== "Viewer") {
      user.role = "Viewer";
      if (!write(KEYS.users, users)) return;
    }
    writeFlag(migrationKey, "1");
  }

  function migrateSampleProgramData() {
    var migrationKey = "chdo_sample_program_data_v2";
    if (readFlag(migrationKey)) return;

    var sampleById = {};
    (window.SAMPLE_APPLICANTS || []).forEach(function (applicant) {
      sampleById[applicant.id] = applicant;
    });
    var sampleActivitiesById = {};
    (window.SAMPLE_ACTIVITIES || []).forEach(function (activity) {
      sampleActivitiesById[activity.id] = activity;
    });

    var applicants = getApplicants();
    var changed = false;
    applicants.forEach(function (applicant) {
      var sample = sampleById[applicant.id];
      if (!sample || APP_CONFIG.housingPrograms.indexOf(applicant.housingProgram) !== -1) return;

      applicant.housingProgram = sample.housingProgram;
      applicant.status = sample.status;
      applicant.lotNo = sample.lotNo;
      applicant.area = sample.area;
      if (sample.housingProgram === APP_CONFIG.housingPrograms[1]) {
        delete applicant.block;
        delete applicant.detailsDate;
      } else {
        applicant.block = sample.block;
        applicant.detailsDate = applicant.detailsDate || applicant.applicationDate || sample.detailsDate;
      }
      changed = true;
    });

    var activities = read(KEYS.activities, []);
    var activitiesChanged = false;
    activities.forEach(function (activity) {
      var sample = sampleActivitiesById[activity.id];
      if (!sample) return;
      if (activity.message !== sample.message || activity.type !== sample.type) {
        activity.message = sample.message;
        activity.type = sample.type;
        activitiesChanged = true;
      }
    });

    var applicantsSaved = !changed || write(KEYS.applicants, applicants);
    var activitiesSaved = !activitiesChanged || write(KEYS.activities, activities);
    if (applicantsSaved && activitiesSaved) writeFlag(migrationKey, "1");
  }

  function createViewerApplicant(user, applicants) {
    var nameParts = String(user.fullName || "").trim().split(/\s+/).filter(Boolean);
    var firstName = nameParts.shift() || "Viewer";
    var lastName = nameParts.length ? nameParts.pop() : "";
    return {
      id: generateApplicationIdFor(applicants),
      firstName: firstName,
      middleName: nameParts.join(" "),
      lastName: lastName,
      suffix: "",
      birthdate: "",
      age: "",
      sex: "",
      civilStatus: "",
      contactNumber: user.contactNumber || "",
      email: user.email || "",
      province: APP_CONFIG.formDefaults.province,
      city: APP_CONFIG.formDefaults.city,
      barangay: "",
      street: "",
      applicationDate: todayISO(),
      housingProgram: APP_CONFIG.housingPrograms[0],
      status: APP_CONFIG.defaultStatus,
      remarks: "Profile created for Viewer account.",
      assignedStaff: "",
      createdAt: new Date().toISOString()
    };
  }

  function seedApplicantViewers() {
    var users = getUsers();
    var applicants = getApplicants();
    var usersChanged = false;
    var applicantsChanged = false;
    var assignedApplicantIds = {};
    var sampleViewerProfiles = {
      "Kenowev Amores": "CHDO-2026-0021",
      "Emmanuel Conarco": "CHDO-2026-0022"
    };

    applicants.slice(0, 5).forEach(function (applicant) {
      if (users.some(function (user) {
        return user.role === "Viewer" && user.applicantId === applicant.id;
      })) return;

      var fullName = [applicant.firstName, applicant.middleName, applicant.lastName, applicant.suffix]
        .filter(Boolean).join(" ");
      users.push({
        id: generateUserIdFor(users),
        fullName: fullName,
        username: "a-" + String(applicant.id).toLowerCase(),
        email: applicant.email || "",
        contactNumber: applicant.contactNumber || "",
        position: "Applicant",
        role: "Viewer",
        status: "Active",
        dateCreated: todayISO(),
        applicantId: applicant.id
      });
      usersChanged = true;
    });

    Object.keys(sampleViewerProfiles).forEach(function (fullName) {
      var profileId = sampleViewerProfiles[fullName];
      var profile = applicants.filter(function (applicant) { return applicant.id === profileId; })[0];
      if (!profile) {
        profile = (window.SAMPLE_APPLICANTS || []).filter(function (applicant) {
          return applicant.id === profileId;
        })[0];
        if (profile) {
          applicants.push(clone(profile));
          applicantsChanged = true;
        }
      }
    });

    users.forEach(function (user) {
      if (user.fullName === "Kenowev Mores") {
        user.fullName = "Kenowev Amores";
        usersChanged = true;
      }
      if (user.role !== "Viewer") return;

      var sampleProfileId = sampleViewerProfiles[user.fullName];
      var linkedApplicant = sampleProfileId
        ? applicants.filter(function (applicant) { return applicant.id === sampleProfileId; })[0]
        : applicants.filter(function (applicant) { return applicant.id === user.applicantId; })[0];

      if (!linkedApplicant || assignedApplicantIds[linkedApplicant.id]) {
        linkedApplicant = applicants.filter(function (applicant) {
          return !assignedApplicantIds[applicant.id] &&
            [applicant.firstName, applicant.middleName, applicant.lastName, applicant.suffix]
              .filter(Boolean).join(" ").toLowerCase() === user.fullName.toLowerCase();
        })[0];
      }

      if (!linkedApplicant || assignedApplicantIds[linkedApplicant.id]) {
        linkedApplicant = createViewerApplicant(user, applicants);
        applicants.push(linkedApplicant);
        applicantsChanged = true;
      }

      assignedApplicantIds[linkedApplicant.id] = true;
      if (user.applicantId !== linkedApplicant.id) {
        user.applicantId = linkedApplicant.id;
        usersChanged = true;
      }
    });

    var applicantsSaved = !applicantsChanged || write(KEYS.applicants, applicants);
    var usersSaved = !usersChanged || write(KEYS.users, users);
    if (applicantsSaved && usersSaved) writeFlag(KEYS.applicantViewers, "1");
  }

  /** Copy the sample data into LocalStorage the first time only. */
  function init() {
    if (!readFlag(KEYS.seeded)) {
      write(KEYS.applicants, clone(window.SAMPLE_APPLICANTS || []));
      write(KEYS.users, clone(window.SAMPLE_USERS || []));
      write(KEYS.activities, clone(window.SAMPLE_ACTIVITIES || []));
      writeFlag(KEYS.seeded, "1");
    }
    migrateRenamedUsers();
    migrateEmmanuelViewer();
    migrateSampleProgramData();
    seedApplicantViewers();
  }

  /* ---------- Applicants ---------- */

  function getApplicants() { return read(KEYS.applicants, []); }

  function getApplicant(id) {
    return getApplicants().filter(function (a) { return a.id === id; })[0] || null;
  }

  function applicantIdExists(id) { return !!getApplicant(id); }

  /** Next ID in the form CHDO-YYYY-0001 (never reuses an existing ID). */
  function generateApplicationId() {
    return generateApplicationIdFor(getApplicants());
  }

  function generateApplicationIdFor(applicants) {
    var prefix = "CHDO-" + new Date().getFullYear() + "-";
    var highest = 0;
    applicants.forEach(function (a) {
      if (a.id.indexOf(prefix) === 0) {
        var n = parseInt(a.id.slice(prefix.length), 10);
        if (!isNaN(n) && n > highest) highest = n;
      }
    });
    return prefix + String(highest + 1).padStart(4, "0");
  }

  /**
   * Insert (isNew = true) or update (isNew = false) an applicant.
   * Returns { ok: true } or { ok: false, error: "message" }.
   */
  function saveApplicant(record, isNew) {
    var list = getApplicants();
    var index = -1;
    list.forEach(function (a, i) { if (a.id === record.id) index = i; });

    if (isNew) {
      if (index !== -1) return { ok: false, error: "Application ID " + record.id + " already exists." };
      list.push(record);
    } else {
      if (index === -1) return { ok: false, error: "Record " + record.id + " was not found." };
      list[index] = record;
    }
    return write(KEYS.applicants, list) ? { ok: true } : { ok: false, error: "Browser storage is full or blocked." };
  }

  function deleteApplicant(id) {
    var list = getApplicants();
    var remaining = list.filter(function (a) { return a.id !== id; });
    if (remaining.length === list.length) return false;
    return write(KEYS.applicants, remaining);
  }

  /* ---------- Users ---------- */

  function getUsers() { return read(KEYS.users, []); }

  function getUser(id) {
    return getUsers().filter(function (u) { return u.id === id; })[0] || null;
  }

  function generateUserId() {
    return generateUserIdFor(getUsers());
  }

  function generateUserIdFor(users) {
    var highest = 0;
    users.forEach(function (u) {
      var n = parseInt(String(u.id).replace("USR-", ""), 10);
      if (!isNaN(n) && n > highest) highest = n;
    });
    return "USR-" + String(highest + 1).padStart(3, "0");
  }

  /** Insert or update a user. Usernames and e-mails must be unique. */
  function saveUser(user, isNew) {
    var list = getUsers();
    var applicants = getApplicants();
    var index = -1;
    list.forEach(function (u, i) { if (u.id === user.id) index = i; });

    var clash = list.filter(function (u) {
      return u.id !== user.id && u.username.toLowerCase() === user.username.toLowerCase();
    })[0];
    if (clash) return { ok: false, error: "Username \"" + user.username + "\" is already taken." };

    if (user.email) {
      var emailClash = list.filter(function (u) {
        return u.id !== user.id && u.email && u.email.toLowerCase() === user.email.toLowerCase();
      })[0];
      if (emailClash) return { ok: false, error: "E-mail \"" + user.email + "\" is already used by another user." };
    }

    if (isNew) {
      if (index !== -1) return { ok: false, error: "User ID " + user.id + " already exists." };
    } else {
      if (index === -1) return { ok: false, error: "User was not found." };
    }

    if (user.role === "Viewer" && !user.applicantId) {
      var applicant = createViewerApplicant(user, applicants);
      if (!write(KEYS.applicants, applicants.concat([applicant]))) {
        return { ok: false, error: "The Viewer profile could not be saved because browser storage is full or blocked." };
      }
      user.applicantId = applicant.id;
    }

    if (isNew) list.push(user);
    else list[index] = user;
    return write(KEYS.users, list) ? { ok: true } : { ok: false, error: "Browser storage is full or blocked." };
  }

  function deleteUser(id) {
    var list = getUsers();
    var remaining = list.filter(function (u) { return u.id !== id; });
    if (remaining.length === list.length) return false;
    return write(KEYS.users, remaining);
  }

  /* ---------- Current (signed-in) user ---------- */

  function getCurrentUserId() { return readFlag(KEYS.currentUser) || ""; }
  function setCurrentUserId(id) { writeFlag(KEYS.currentUser, id); }

  /* ---------- Activity log ---------- */

  function getActivities(limit) {
    var list = read(KEYS.activities, []).slice().sort(function (a, b) {
      return a.timestamp < b.timestamp ? 1 : a.timestamp > b.timestamp ? -1 : 0;
    });
    return limit ? list.slice(0, limit) : list;
  }

  /** Add an entry to the Recent Activity list (keeps the latest 50). */
  function logActivity(type, message, userName) {
    var list = read(KEYS.activities, []);
    var now = new Date();
    var stamp = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" +
      String(now.getDate()).padStart(2, "0") + "T" + String(now.getHours()).padStart(2, "0") + ":" +
      String(now.getMinutes()).padStart(2, "0") + ":" + String(now.getSeconds()).padStart(2, "0");
    list.push({
      id: "ACT-" + Date.now(),
      type: type,
      message: message,
      user: userName || "System",
      timestamp: stamp
    });
    list.sort(function (a, b) { return a.timestamp < b.timestamp ? 1 : -1; });
    write(KEYS.activities, list.slice(0, 50));
  }

  return {
    init: init, todayISO: todayISO,
    getApplicants: getApplicants, getApplicant: getApplicant, applicantIdExists: applicantIdExists,
    generateApplicationId: generateApplicationId, saveApplicant: saveApplicant, deleteApplicant: deleteApplicant,
    getUsers: getUsers, getUser: getUser, generateUserId: generateUserId, saveUser: saveUser, deleteUser: deleteUser,
    getCurrentUserId: getCurrentUserId, setCurrentUserId: setCurrentUserId,
    getActivities: getActivities, logActivity: logActivity
  };
})();

</script>

/* ===== assets\js\app.js ===== */
/* ==========================================================
   app.js  -  Shared helpers and application start-up
   Utils : small formatting / validation helpers
   App   : icons, permissions, toast, modal, confirm dialog
   ========================================================== */
var Utils = (function () {
  "use strict";

  /** Escape text so it is safe to put inside HTML. */
  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  /** "2026-11-09" -> "Nov 9, 2026" */
  function formatDate(iso) {
    if (!iso) return "-";
    var p = String(iso).slice(0, 10).split("-");
    if (p.length !== 3) return iso;
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    return d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
  }

  /** "2026-11-09T14:05:00" -> "Nov 9, 2026, 2:05 PM" */
  function formatDateTime(iso) {
    if (!iso) return "-";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleString("en-US", { year: "numeric", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  }

  /** Age in whole years from a YYYY-MM-DD birthdate. */
  function computeAge(birthdate) {
    if (!birthdate) return "";
    var p = birthdate.split("-");
    if (p.length !== 3) return "";
    var today = new Date();
    var age = today.getFullYear() - Number(p[0]);
    var monthDiff = today.getMonth() + 1 - Number(p[1]);
    if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < Number(p[2]))) age--;
    return age;
  }

  /** "Maria Luisa Santos Dela Cruz Jr." (fields stay separate in storage) */
  function fullName(a) {
    return [a.firstName, a.middleName, a.lastName, a.suffix].filter(Boolean).join(" ");
  }

  function statusInfo(status) {
    var list = APP_CONFIG.statuses;
    for (var i = 0; i < list.length; i++) if (list[i].value === status) return list[i];
    if (APP_CONFIG.paymentStatusStyles[status]) {
      return { value: status, css: APP_CONFIG.paymentStatusStyles[status], section: "program" };
    }
    return { value: status, css: "review", section: "review" };
  }

  function statusBadge(status) {
    var reviewClass = status === "For Review" ? " badge-for-review" : "";
    return '<span class="badge badge-' + statusInfo(status).css + reviewClass + '">' + esc(status) + "</span>";
  }

  function initials(name) {
    return String(name || "?").split(/\s+/).filter(Boolean).slice(0, 2)
      .map(function (w) { return w.charAt(0).toUpperCase(); }).join("");
  }

  function isValidEmail(value) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value); }
  function isValidPhone(value) { return /^[0-9+\-\s()]{7,15}$/.test(value); }

  <script>
/* ===== assets\js\filtering.js ===== */
/* ==========================================================
   filtering.js  -  Search, filters and sorting
   Used by every records table (Applicants, Approved,
   For Review, For Survey, Rejected / Denied).
   Each table keeps its own "state" object with the current
   search text, filters and sort order.
   ========================================================== */
var Filtering = (function () {
  "use strict";

  var SORT_CHOICES = [
    { value: "applicationDate:desc", label: "Application date (newest first)" },
    { value: "applicationDate:asc",  label: "Application date (oldest first)" },
    { value: "lastName:asc",         label: "Last name (A to Z)" },
    { value: "lastName:desc",        label: "Last name (Z to A)" },
    { value: "id:asc",               label: "Application ID (lowest first)" },
    { value: "id:desc",              label: "Application ID (highest first)" }
  ];

  function createState() {
    return { search: "", status: "", program: "", barangay: "", dateFrom: "", dateTo: "",
             sortKey: "applicationDate", sortDir: "desc" };
  }

  function norm(value) { return String(value || "").toLowerCase(); }

  /** Search by Application ID, first / middle / last name or barangay. */
  function matchesSearch(a, term) {
    if (!term) return true;
    var haystack = [
      a.id, a.firstName, a.middleName, a.lastName, a.barangay,
      [a.firstName, a.middleName, a.lastName].filter(Boolean).join(" "),
      [a.firstName, a.lastName].filter(Boolean).join(" ")
    ].map(norm).join("|");
    return term.split(/\s+/).every(function (word) { return haystack.indexOf(word) !== -1; });
  }

  function sortRecords(list, key, dir) {
    var factor = dir === "desc" ? -1 : 1;
    return list.slice().sort(function (a, b) {
      var result = norm(a[key]).localeCompare(norm(b[key]), undefined, { numeric: true });
      if (result === 0) result = a.id.localeCompare(b.id);
      return result * factor;
    });
  }

  /** Apply search + filters + sorting from "state" to a list of records. */
  function apply(records, state) {
    var term = norm(state.search).trim();
    var filtered = records.filter(function (a) {
      if (!matchesSearch(a, term)) return false;
      if (state.status && a.status !== state.status) return false;
      if (state.program && a.housingProgram !== state.program) return false;
      if (state.barangay && a.barangay !== state.barangay) return false;
      if (state.dateFrom && a.applicationDate < state.dateFrom) return false;
      if (state.dateTo && a.applicationDate > state.dateTo) return false;
      return true;
    });
    return sortRecords(filtered, state.sortKey, state.sortDir);
  }

  function hasActiveFilters(state) {
    return !!(state.search || state.status || state.program || state.barangay || state.dateFrom || state.dateTo);
  }

  /** HTML of the search / filter bar. */
  function toolbarHTML(showStatus) {
    return '' +
      '<div class="search-box">' + App.icon("search", 16) +
        '<input type="search" data-filter="search" placeholder="Search by ID, name or barangay" aria-label="Search records"></div>' +
      '<div class="filter-row">' +
        (showStatus ? '<label class="filter-field"><span>Status</span><select data-filter="status"></select></label>' : "") +
        '<label class="filter-field"><span>Housing program</span><select data-filter="program"></select></label>' +
        '<label class="filter-field"><span>Barangay</span><select data-filter="barangay"></select></label>' +
        '<label class="filter-field"><span>Date from</span><input type="date" data-filter="dateFrom"></label>' +
        '<label class="filter-field"><span>Date to</span><input type="date" data-filter="dateTo"></label>' +
        '<label class="filter-field"><span>Sort by</span><select data-filter="sort"></select></label>' +
        '<button type="button" class="btn btn-secondary btn-reset" data-filter-reset>' + App.icon("refresh", 16) + " Reset filters</button>" +
      "</div>";
  }

  function fillSelect(select, firstLabel, values, selected) {
    if (!select) return selected;
    var keep = values.indexOf(selected) !== -1 ? selected : "";
    select.innerHTML = Utils.optionsHTML(values, keep, firstLabel);
    return keep;
  }

  /**
   * Refresh dropdown choices from the real records and show the
   * current state in each control.
   */
  function syncControls(root, state, records, statusOptions) {
    var programs = APP_CONFIG.housingPrograms.slice();
    var barangays = [];
    records.forEach(function (a) {
      if (a.housingProgram && programs.indexOf(a.housingProgram) === -1) programs.push(a.housingProgram);
      if (a.barangay && barangays.indexOf(a.barangay) === -1) barangays.push(a.barangay);
    });
    barangays.sort(function (x, y) { return x.localeCompare(y); });

    state.status = fillSelect(root.querySelector('[data-filter="status"]'), "All statuses", statusOptions || [], state.status);
    state.program = fillSelect(root.querySelector('[data-filter="program"]'), "All programs", programs, state.program);
    state.barangay = fillSelect(root.querySelector('[data-filter="barangay"]'), "All barangays", barangays, state.barangay);

    var search = root.querySelector('[data-filter="search"]');
    if (search && search.value !== state.search) search.value = state.search;
    root.querySelector('[data-filter="dateFrom"]').value = state.dateFrom;
    root.querySelector('[data-filter="dateTo"]').value = state.dateTo;

    var sortSelect = root.querySelector('[data-filter="sort"]');
    var current = state.sortKey + ":" + state.sortDir;
    var known = SORT_CHOICES.some(function (c) { return c.value === current; });
    sortSelect.innerHTML = (known ? "" : '<option value="" selected>Sorted by column</option>') +
      SORT_CHOICES.map(function (c) {
        return '<option value="' + c.value + '"' + (c.value === current ? " selected" : "") + ">" + c.label + "</option>";
      }).join("");
  }

  /** Connect the toolbar controls to the state. onChange() redraws the table. */
  function bind(root, state, onChange) {
    var typing = Utils.debounce(function () { onChange(); }, 200);

    root.addEventListener("input", function (e) {
      var key = e.target.getAttribute("data-filter");
      if (key === "search") { state.search = e.target.value; typing(); }
    });

    root.addEventListener("change", function (e) {
      var key = e.target.getAttribute("data-filter");
      if (!key || key === "search") return;
      if (key === "sort") {
        if (e.target.value) {
          var parts = e.target.value.split(":");
          state.sortKey = parts[0];
          state.sortDir = parts[1];
        }
      } else {
        state[key] = e.target.value;
      }
      onChange();
    });

    root.addEventListener("click", function (e) {
      if (e.target.closest("[data-filter-reset]")) {
        var fresh = createState();
        Object.keys(fresh).forEach(function (k) { state[k] = fresh[k]; });
        root.querySelector('[data-filter="search"]').value = "";
        onChange();
        App.toast("Filters have been reset.", "info");
      }
    });
  }

  /** Called when a table header is clicked. */
  function toggleSort(state, key) {
    if (state.sortKey === key) {
      state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
    } else {
      state.sortKey = key;
      state.sortDir = key === "applicationDate" ? "desc" : "asc";
    }
  }

  return {
    createState: createState, apply: apply, hasActiveFilters: hasActiveFilters,
    toolbarHTML: toolbarHTML, syncControls: syncControls, bind: bind, toggleSort: toggleSort
  };
})();

</script>

var Applicants = (function () {

                statuses: null, statusFilter: APP_CONFIG.statuses.map(function (s) { return s.value; }).concat(APP_CONFIG.paymentStatuses),
                emptyText: "No applicants have been registered yet." },

                statuses: ["Approved"], statusFilter: null, emptyText: "No approved applications yet." },

            }).join("") +
